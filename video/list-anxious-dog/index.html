<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anxious Dog List</title>
<style>
@font-face{font-family:Anton;font-weight:400;src:url(fonts/anton.woff2) format('woff2')}
@font-face{font-family:Fraunces;font-style:normal;font-weight:300 700;src:url(fonts/fraunces-normal.woff2) format('woff2')}
@font-face{font-family:Fraunces;font-style:italic;font-weight:300 700;src:url(fonts/fraunces-italic.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:100 900;src:url(fonts/inter-var.woff2) format('woff2')}
:root{--deep:#0B2A23;--green:#0C342A;--tile:#134A3D;--rust:#A8542F;--mark:#C25E2E;--mint:#9FE8C9;--paper:#FAF9F6;--pale:#EDF1EC;--ink:#101B17;--mute:#5E6E66;--line:#E3E8E6;--gold:#C9982E}
html,body{margin:0;height:100%;background:#111;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--deep);transform-origin:0 0}
#world{position:absolute;inset:0}
.g{position:absolute;left:0;top:0;width:1080px;height:1920px}
.L{position:absolute;left:0;top:0;display:none}
.full{width:1080px;height:1920px}
.big{font-family:Anton,Impact,sans-serif;font-weight:400;line-height:.92;white-space:nowrap;text-transform:uppercase;letter-spacing:.005em}
.big em{font-family:Fraunces,serif;font-style:italic;font-weight:600;text-transform:none;letter-spacing:-.02em;font-size:1.04em}
.w{display:inline-block}
.ui{font-family:Inter,sans-serif}
.pill5{width:160px;height:58px;border-radius:29px;overflow:hidden}
.pill5 .tf{position:absolute;left:0;top:0;height:58px;border-radius:29px}
.pill5 span{position:absolute;left:0;right:0;top:0;text-align:center;font:900 34px/58px Inter,sans-serif}
.card{background:#fff;border-radius:40px;box-sizing:border-box}
.cap{font:900 64px/1.2 Inter,sans-serif;width:876px;letter-spacing:-.01em;text-wrap:balance}
.cap .cw{display:inline-block;position:relative;z-index:2;padding:0 9px;margin:0 -4px}
.cap .hl{position:absolute;left:0;top:0;border-radius:16px;z-index:1}
svg{display:block;overflow:visible}
.ol *{fill:#fff!important;stroke:#fff!important;stroke-width:26px!important;stroke-linejoin:round!important;stroke-dasharray:none!important}
.sh *{fill:rgba(16,27,23,.28)!important;stroke:rgba(16,27,23,.28)!important;stroke-width:26px!important;stroke-linejoin:round!important;stroke-dasharray:none!important}
</style>
</head>
<body>
<div id="stage"><div id="world"></div></div>
<script src="lib/motion.js"></script>
<script src="cues.js"></script>
<script>
const { spring: sp, track: T, mix } = Motion;
const { B, ITEMS, IT, SC, HK, P1, P2, capWords, headWords } = TL;
const W = 1080, H = 1920, DUR = TL.DUR, FPS = 30;
const bt = b => b * B;
const stage = document.getElementById('stage'), world = document.getElementById('world');
// extra spring shapes (still closed-form springs from lib/motion.js)
const SLAM = { w: 19, z: 0.55 }, SLAP = { w: 22, z: 0.6 }, WIPE = { w: 17, z: 0.9 };

const TH = {
  deep: { bg: '#0B2A23', shade: '#134A3D', tx: '#FAF9F6', ac: '#9FE8C9', hiBg: '#9FE8C9', hiTx: '#0B2A23', num: '#9FE8C9', numSh: '#04140F', band: '#C25E2E', off: [250, 249, 246] },
  mint: { bg: '#9FE8C9', shade: '#88DAB8', tx: '#0B2A23', ac: '#A8542F', hiBg: '#0B2A23', hiTx: '#9FE8C9', num: '#0B2A23', numSh: '#6CC6A0', band: '#FAF9F6', off: [11, 42, 35] },
  rust: { bg: '#A8542F', shade: '#974A27', tx: '#FAF9F6', ac: '#9FE8C9', hiBg: '#FAF9F6', hiTx: '#A8542F', num: '#FAF9F6', numSh: '#6E3219', band: '#0B2A23', off: [250, 249, 246] },
  paper: { bg: '#FAF9F6', shade: '#EDF1EC', tx: '#101B17', ac: '#A8542F', hiBg: '#A8542F', hiTx: '#FAF9F6', num: '#0B2A23', numSh: '#D8E0DB', band: '#9FE8C9', off: [16, 27, 23] },
};
const rgba = (c, a) => `rgba(${c.join(',')},${a})`;

/* ---------------- building blocks ---------------- */
const ALL = [];
function el(parent, html = '', cls = '', style = '') {
  const e = document.createElement('div');
  e.className = 'L ' + cls; e.innerHTML = html; e.style.cssText += style;
  parent.appendChild(e); ALL.push(e); return e;
}
function group(z) { const g = document.createElement('div'); g.className = 'g'; g.style.zIndex = z; world.appendChild(g); ALL.push(g); return g; }
function put(e, o = {}) {
  const { x = 0, y = 0, s = 1, sx = s, sy = s, r = 0, o: op = 1, ox = null, oy = null } = o;
  if (op <= 0.003) { e.style.display = 'none'; return; }
  e.style.display = 'block';
  e.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${sx},${sy})`;
  e.style.transformOrigin = `${ox ?? (e._w || 0) / 2}px ${oy ?? (e._h || 0) / 2}px`;
  e.style.opacity = Math.min(1, op);
}
// a point (lx,ly) on an element placed at (x,y) with origin (ox,oy), scale s and rotation r (deg)
const onEl = (x, y, ox, oy, s, r, lx, ly) => { const a = r * Math.PI / 180, dx = (lx - ox) * s, dy = (ly - oy) * s; return [x + ox + dx * Math.cos(a) - dy * Math.sin(a), y + oy + dx * Math.sin(a) + dy * Math.cos(a)]; };
const rise = (t, t0, d, p = 'default') => d * (1 - sp(t - t0, p));
const op = (t, t0, p = 'snappy') => sp(t - t0, p);
const press = (t, t0, depth = 0.92) => T(t, 1, [[t0, depth, 'snappy'], [t0 + 0.1, 1, 'snappy']]);
const pop = (t, t0, from = 0.4, p = 'default') => T(t, from, [[t0, 1, p]]);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
// "*word*" marks the italic Fraunces accent
const md = s => s.split(' ').map(w => /^\*.*\*$/.test(w) ? `<span class="w"><em>${esc(w.slice(1, -1))}</em></span>` : `<span class="w">${esc(w)}</span>`).join(' ');
function popWords(e, t, times, d = 50, from = 0.3) {
  e.querySelectorAll('.w').forEach((w, i) => {
    const t0 = times[i], k = sp(t - t0, SLAP), s = from + (1 - from) * k;
    w.style.opacity = t >= t0 ? 1 : 0;
    w.style.transform = `translateY(${d * (1 - sp(t - t0, 'snappy'))}px) scale(${s})`;
  });
}
function setDraw(p, k) { const L = p._len || (p._len = p.getTotalLength() + 2); p.style.strokeDasharray = `${L} ${L}`; p.style.strokeDashoffset = L * (1 - Math.max(0, Math.min(1, k))); p.style.visibility = k <= 0.001 ? 'hidden' : 'visible'; }

/* ---------------- original product illustrations (300x300, no animals) ---------------- */
const LEAF = (x, y, s = 1, c = '#3BB273') => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 34 C-20 18 -18 -12 0 -34 C18 -12 20 18 0 34Z" fill="${c}"/><path d="M0 30 V-24" stroke="#FAF9F6" stroke-width="4" stroke-linecap="round"/></g>`;
const SPRIG = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 40 V-30" stroke="#3B7A4E" stroke-width="5" stroke-linecap="round"/>${[-30, -18, -6, 6, 18].map((yy, i) => `<ellipse cx="${i % 2 ? 7 : -7}" cy="${yy}" rx="8" ry="11" fill="#7D5CC0"/>`).join('')}<ellipse cx="0" cy="-38" rx="7" ry="10" fill="#7D5CC0"/></g>`;
const FLOWER = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">${[0, 60, 120, 180, 240, 300].map(a => `<ellipse cx="0" cy="-17" rx="9" ry="15" fill="#FAF9F6" transform="rotate(${a})"/>`).join('')}<circle r="11" fill="#E9B23A"/></g>`;
const ILL = {
  pouch: {
    main: `<path d="M80 56 H220 L232 250 Q234 274 210 274 H90 Q66 274 68 250 Z" fill="#C25E2E"/>
      <rect x="74" y="40" width="152" height="32" rx="8" fill="#A8542F"/>
      <path d="M86 92 H214" stroke="#8C4424" stroke-width="6" stroke-linecap="round"/>
      <rect x="98" y="112" width="104" height="120" rx="18" fill="#FAF9F6"/>
      ${LEAF(150, 160, 1.05)}
      <rect x="116" y="208" width="68" height="10" rx="5" fill="#C25E2E"/>
      <rect x="30" y="222" width="80" height="62" rx="24" fill="#D9A066"/>
      <rect x="196" y="228" width="80" height="58" rx="24" fill="#C98E52"/>`,
    extra: `<circle cx="56" cy="246" r="5" fill="#B57A42"/><circle cx="80" cy="258" r="5" fill="#B57A42"/><circle cx="224" cy="250" r="5" fill="#A86F38"/><circle cx="248" cy="262" r="5" fill="#A86F38"/>
      <path d="M200 40 l8 -10 l8 10" fill="none" stroke="#FAF9F6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`,
  },
  spray: {
    main: `<path d="M112 56 H196 Q210 56 210 70 V100 H112 Z" fill="#FAF9F6"/>
      <rect x="70" y="62" width="48" height="22" rx="8" fill="#FAF9F6"/>
      <path d="M150 98 L134 146 Q130 158 142 158 L166 104 Z" fill="#E3E8E6"/>
      <rect x="132" y="96" width="58" height="34" rx="8" fill="#6E52AE"/>
      <rect x="104" y="124" width="114" height="156" rx="30" fill="#9B7FD4"/>
      <rect x="118" y="160" width="86" height="96" rx="14" fill="#FAF9F6"/>
      ${SPRIG(161, 206, 0.95)}`,
    extra: `<rect x="112" y="136" width="10" height="120" rx="5" fill="#C2B0EA" opacity=".8"/>
      <circle cx="46" cy="60" r="7" fill="#FAF9F6" opacity=".9"/><circle cx="30" cy="80" r="5" fill="#FAF9F6" opacity=".8"/><circle cx="44" cy="96" r="6" fill="#FAF9F6" opacity=".85"/><circle cx="22" cy="54" r="4" fill="#FAF9F6" opacity=".7"/>`,
  },
  mat: {
    main: `<rect x="36" y="46" width="228" height="216" rx="48" fill="#38B2A3"/>
      <rect x="64" y="72" width="172" height="164" rx="34" fill="none" stroke="#228576" stroke-width="12" stroke-dasharray="120 24"/>
      <rect x="96" y="102" width="108" height="104" rx="22" fill="none" stroke="#228576" stroke-width="12" stroke-dasharray="70 22"/>
      <circle cx="150" cy="154" r="20" fill="#228576"/>`,
    extra: `${[[52, 62], [248, 62], [52, 246], [248, 246]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="6" fill="#7FD6CB"/>`).join('')}
      <path d="M176 120 C196 110 214 124 206 140 C200 152 182 150 176 140 C168 132 166 124 176 120Z" fill="#E7C08A"/>
      <path d="M80 220 C92 212 108 216 110 226 C112 236 96 240 86 236 C76 232 72 226 80 220Z" fill="#E7C08A"/>`,
  },
  plug: {
    main: `<rect x="138" y="20" width="24" height="44" rx="5" fill="#B9C3BE"/>
      <rect x="62" y="74" width="40" height="22" rx="5" fill="#B9C3BE"/>
      <rect x="198" y="74" width="40" height="22" rx="5" fill="#B9C3BE"/>
      <rect x="82" y="54" width="136" height="124" rx="30" fill="#FAF9F6"/>
      <rect x="122" y="172" width="56" height="26" rx="6" fill="#DCE3DF"/>
      <path d="M110 194 H190 V258 Q190 280 168 280 H132 Q110 280 110 258 Z" fill="#5C9A6A"/>
      <rect x="124" y="214" width="52" height="46" rx="8" fill="#FAF9F6"/>
      ${LEAF(150, 237, 0.48, '#3B7A4E')}`,
    extra: `<circle cx="150" cy="112" r="15" fill="#3BB273"/><circle cx="150" cy="112" r="6" fill="#B7F0C9"/>
      <path d="M244 150 q16 -16 0 -32 q-16 -16 0 -32" fill="none" stroke="#FAF9F6" stroke-width="7" stroke-linecap="round"/>
      <path d="M268 166 q14 -14 0 -28 q-14 -14 0 -28" fill="none" stroke="#FAF9F6" stroke-width="6" stroke-linecap="round" opacity=".7"/>`,
  },
  jar: {
    main: `<rect x="80" y="40" width="140" height="50" rx="12" fill="#2F7FA6"/>
      <path d="M86 86 H214 Q232 86 232 106 V254 Q232 278 208 278 H92 Q68 278 68 254 V106 Q68 86 86 86Z" fill="#FAF9F6"/>
      <rect x="68" y="132" width="164" height="104" fill="#9B7FD4"/>
      ${FLOWER(150, 184, 1.25)}
      <rect x="24" y="236" width="74" height="54" rx="22" fill="#9A5B33"/>
      <rect x="208" y="240" width="72" height="50" rx="22" fill="#B06A3B"/>`,
    extra: `<path d="M98 50 V80 M122 50 V80 M146 50 V80 M170 50 V80 M194 50 V80" stroke="#246A8C" stroke-width="5" stroke-linecap="round"/>
      <circle cx="50" cy="256" r="5" fill="#7C4524"/><circle cx="72" cy="268" r="5" fill="#7C4524"/><circle cx="234" cy="258" r="5" fill="#8E5530"/>`,
  },
  drops: {
    main: `<rect x="128" y="22" width="44" height="64" rx="20" fill="#101B17"/>
      <rect x="118" y="80" width="64" height="34" rx="8" fill="#2A2F2C"/>
      <path d="M112 112 H188 Q216 124 216 156 V256 Q216 280 192 280 H108 Q84 280 84 256 V156 Q84 124 112 112Z" fill="#B8742F"/>
      <rect x="100" y="160" width="100" height="90" rx="14" fill="#FAF9F6"/>
      ${LEAF(150, 205, 0.7)}`,
    extra: `<rect x="96" y="150" width="9" height="104" rx="4" fill="#D79A5A" opacity=".8"/>`,
  },
  pad: {
    main: `<rect x="24" y="86" width="252" height="160" rx="54" fill="#6E8F88"/>
      <rect x="46" y="106" width="208" height="120" rx="40" fill="none" stroke="#FAF9F6" stroke-width="5" stroke-dasharray="10 10"/>`,
    extra: `<path d="M86 132 L150 196 L214 132 M86 196 L150 132 L214 196" stroke="#587A73" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M110 66 q12 -12 0 -24 q-12 -12 0 -24 M150 66 q12 -12 0 -24 q-12 -12 0 -24 M190 66 q12 -12 0 -24 q-12 -12 0 -24" fill="none" stroke="#F2A06B" stroke-width="7" stroke-linecap="round"/>`,
  },
};
function ill(name, size) {
  const { main, extra } = ILL[name];
  return `<svg width="${size}" height="${size}" viewBox="0 0 300 300"><g class="sh" transform="translate(8 12)">${main}</g><g class="ol">${main}</g>${main}${extra}</svg>`;
}
const STAR = c => `<svg width="64" height="64" viewBox="0 0 64 64"><path d="M32 4 L40 23 L60 24 L44 37 L50 58 L32 46 L14 58 L20 37 L4 24 L24 23 Z" fill="${c}"/></svg>`;
const ARROW = (c, s = 56) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64" style="display:inline-block;vertical-align:middle"><path d="M10 32 H50 M34 16 L50 32 L34 48" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function mark(size, bg, fg) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="${bg}"/><rect x="42" y="22" width="16" height="56" rx="6" fill="${fg}"/><rect x="22" y="42" width="56" height="16" rx="6" fill="${fg}"/></svg>`;
}

/* ---------------- shared pieces ---------------- */
// the 5-pill progress tracker, one copy per page so it wipes with its page
function makeTracker(g, th) {
  return [0, 1, 2, 3, 4].map(i => {
    const p = el(g, `<div class="tf" style="background:${th.hiBg}"></div><span>${i + 1}</span>`, 'pill5', `background:${rgba(th.off, 0.16)}`);
    p._sp = p.querySelector('span'); p._tf = p.querySelector('.tf'); return p;
  });
}
function drawTracker(pills, th, t, filled, fillAt) { // pills < filled are full; pill `filled` fills at fillAt
  pills.forEach((p, i) => {
    let k = i < filled ? 1 : i === filled && fillAt != null ? sp(t - fillAt, 'default') : 0;
    k = Math.max(0, Math.min(1.02, k));
    p._tf.style.width = 160 * k + 'px'; p._tf.style.display = k > 0.01 ? 'block' : 'none';
    p._sp.style.color = k > 0.5 ? th.hiTx : rgba(th.off, 0.6);
    const bump = i === filled && fillAt != null ? T(t, 1, [[fillAt, 1.18, 'snappy'], [fillAt + 0.12, 1, 'default']]) : 1;
    put(p, { x: 64 + i * 179, y: 236, s: bump });
  });
}
function makeSlab(g, th, poly) { return el(g, '', 'full', `background:${th.shade};clip-path:polygon(${poly})`); }

/* ================= HOOK (deep green) ================= */
const scenes = [];
const hook = { s: 0, th: TH.deep };
{
  const g = hook.g = group(10), th = hook.th;
  hook.bg = el(g, '', 'full', `background:${th.bg}`);
  hook.slab = makeSlab(g, th, '-400px 1260px, 1480px 780px, 1480px 2300px, -400px 2300px');
  hook.stripe = el(g, '', 'full', 'background:#A8542F;clip-path:polygon(0 1560px, 1080px 1300px, 1080px 1350px, 0 1610px)');
  hook.pills = makeTracker(g, th);
  hook.lines = [md('5 THINGS'), md('THAT CALM'), md('AN *anxious*'), md('DOG')].map(h => el(g, h, 'big', `color:${th.tx}`));
  hook.lines[0].querySelector('.w').style.color = th.ac;
  hook.lines[2].querySelector('em').style.color = th.ac;
  hook.chips = ['Fireworks.', 'Travel.', 'Being left alone.'].map(s => el(g, `<div class="cbg" style="position:absolute;inset:0;border-radius:52px;background:${th.ac}"></div><span class="ui" style="position:relative;display:block;padding:0 34px;font:900 66px/104px Inter;white-space:nowrap;color:${th.hiTx}">${s}</span>`, '', 'height:104px'));
  hook.save = el(g, `<div style="position:absolute;left:30px;top:34px"><svg width="44" height="58" viewBox="0 0 34 44"><path d="M3 3 H31 V41 L17 31 L3 41 Z" fill="#C25E2E"/></svg></div><div class="ui" style="position:absolute;left:96px;top:24px;font:900 44px/1.08 Inter;color:#0B2A23;white-space:nowrap">Save this<br>for later</div>`, '',
    'width:330px;height:144px;border-radius:30px;background:#FAF9F6;box-shadow:8px 10px 0 rgba(0,0,0,.3)');
}
hook.render = (t) => {
  const th = hook.th;
  put(hook.bg);
  put(hook.slab, { x: T(t, 160, [[-0.25, 0, 'heavy']]), y: T(t, 90, [[-0.25, 0, 'heavy']]) });
  put(hook.stripe, { x: T(t, -1080, [[0.0, 0, 'default']]) });
  drawTracker(hook.pills, th, t, 0, null);
  // title is on screen at frame 0, each line still settling in from alternate sides
  let y = hook._top;
  hook.lines.forEach((l, i) => {
    const t0 = -0.42 + i * 0.06, dx = (i % 2 ? 1 : -1) * 160;
    const k5 = i === 0 ? T(t, 1.25, [[-0.1, 1, SLAM]]) : 1;
    put(l, { x: 64 + rise(t, t0, dx, 'default'), y });
    if (i === 0) { const f = l.querySelector('.w'); f.style.transform = `scale(${k5})`; f.style.transformOrigin = '50% 70%'; }
    y += l._h + hook._gap;
  });
  // the three triggers are on screen from frame 0 (still landing), then light up karaoke style on the beat
  hook.chips.forEach((c, i) => {
    const tin = -0.24 + i * 0.04, ti = bt(HK.chips[i]), lit = t >= ti && (i === 2 || t < bt(HK.chips[i + 1])), sung = t >= ti && !lit;
    const [x, cy] = hook._chipPos[i];
    const bump = T(t, 1, [[ti, 1.14, 'snappy'], [ti + 0.1, 1, 'default']]);
    put(c, { x, y: cy + rise(t, tin, 60, 'snappy'), s: pop(t, tin, 0.4, SLAP) * bump, o: t >= tin ? 1 : 0, r: [-2, 1.5, -1][i] });
    c.querySelector('.cbg').style.background = lit ? th.ac : sung ? 'rgba(250,249,246,.2)' : 'rgba(250,249,246,.1)';
    c.querySelector('span').style.color = lit ? th.hiTx : sung ? th.tx : 'rgba(250,249,246,.62)';
  });
  const tsv = bt(HK.save);
  put(hook.save, { x: hook._saveX, y: hook._saveY, s: pop(t, tsv, 1.7, SLAP), r: T(t, 18, [[tsv, -5, SLAP]]), o: t >= tsv ? 1 : 0 });
};
scenes.push(hook);

/* ================= the five items ================= */
ITEMS.forEach((it, idx) => {
  const th = TH[it.bg], sc = { s: SC.items[idx], th, it, idx, tr: it.tr };
  const g = sc.g = group(20 + idx * 10);
  sc.bg = el(g, '', 'full', `background:${th.bg}`);
  sc.slab = makeSlab(g, th, idx % 2 ? '0 820px, 1080px 1060px, 1080px 1920px, 0 1920px' : '0 1060px, 1080px 820px, 1080px 1920px, 0 1920px');
  sc.ghost = el(g, String(idx + 1), 'big', `font-size:640px;line-height:.8;color:transparent;-webkit-text-stroke:5px ${th.numSh}`);
  sc.pills = makeTracker(g, th);
  sc.num = el(g, String(idx + 1), 'big', `font-size:600px;line-height:.8;color:${th.num};text-shadow:14px 16px 0 ${th.numSh}`);
  sc.card = el(g, `<div class="tile" style="position:absolute;left:20px;top:20px;width:480px;height:312px;border-radius:28px;background:${it.tile}"><div style="position:absolute;left:90px;top:6px">${ill(it.ill, 300)}</div></div>
    <div class="ui pn" style="position:absolute;left:28px;top:348px;width:464px;font:800 42px/1.12 Inter;color:var(--ink);letter-spacing:-.01em">${esc(it.name)}</div>`,

  p2._logoW = 110 + p2.logo.querySelector('.ui').offsetWidth;
  window.LAYOUT = { hookEnd: hook._saveY + 44, items: scenes.slice(1, 6).map(sc => ({ head: sc._headY, cap: sc._capY, capH: sc.cap._h, num: sc.num._w })), p1: { card: p1._cardY, rev: p1._revY, revEnd: p1._revY + 84 + p1.quote._h + 16 + 36, quoteW: p1.quote._w }, p2: { logo: p2._logoY + 88, big: p2.big._h }, hs };
  for (const e of ALL) e.style.display = 'none';
}

window.renderFrame = renderFrame; window.DUR = DUR; window.FPS = FPS;
window.ready = Promise.all([document.fonts.load('400 100px Anton'), document.fonts.load('italic 600 100px Fraunces'), document.fonts.load('900 40px Inter'), document.fonts.load('800 40px Inter'), document.fonts.load('700 40px Inter')])
  .then(() => document.fonts.ready).then(() => { measure(); return true; });

if (!new URLSearchParams(location.search).has('render')) {
  const fitView = () => { const k = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `translate(${(innerWidth - W * k) / 2}px,0) scale(${k})`; };
  addEventListener('resize', fitView); fitView();
  window.ready.then(() => { const t0 = performance.now(); const loop = now => { renderFrame(((now - t0) / 1000) % DUR); requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
}
</script>
