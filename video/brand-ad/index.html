<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poorly Pet Ad</title>
<style>
@font-face{font-family:Fraunces;font-style:normal;font-weight:300 700;src:url(fonts/fraunces-normal.woff2) format('woff2')}
@font-face{font-family:Fraunces;font-style:italic;font-weight:300 700;src:url(fonts/fraunces-italic.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:400 800;src:url(fonts/inter-normal.woff2) format('woff2')}
:root{--deep:#0B2A23;--green:#0C342A;--tile:#134A3D;--rust:#A8542F;--mark:#C25E2E;--mint:#9FE8C9;--paper:#FAF9F6;--pale:#EDF1EC;--ink:#101B17;--mute:#5E6E66;--line:#E3E8E6;--gold:#C9982E}
html,body{margin:0;height:100%;background:#111;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--paper);transform-origin:0 0}
#world{position:absolute;inset:0;transform-origin:540px 960px}
.g{position:absolute;left:0;top:0;width:1080px;height:1920px}
.L{position:absolute;left:0;top:0;display:none}
.full{width:1080px;height:1920px}
.disp{font-family:Fraunces,serif;font-weight:540;font-optical-sizing:auto;letter-spacing:-.015em;line-height:.98;white-space:nowrap}
.disp em{font-style:italic;font-weight:480}
.ui{font-family:Inter,sans-serif}
.eyebrow{font:700 34px/1 Inter,sans-serif;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap}
.caret{display:inline-block;width:.07em;height:.78em;margin-left:.04em;background:var(--rust);vertical-align:-.04em}
.w{display:inline-block}
.pill{font:600 40px/1 Inter,sans-serif;padding:22px 34px;border-radius:999px;white-space:nowrap;box-sizing:border-box}
.card{background:#fff;border-radius:28px;border:2px solid var(--line);box-sizing:border-box}
.bar{position:absolute;height:14px;border-radius:7px;background:#E6EAE8}
svg{display:block;overflow:visible}
</style>
</head>
<body>
<div id="stage"><div id="world"></div></div>
<script src="lib/motion.js"></script>
<script src="cues.js"></script>
<script>
const { spring: sp, track: T, mix } = Motion;
const W = 1080, H = 1920, DUR = 30, FPS = 30;
const C = { deep: [11, 42, 35], tile: [19, 74, 61], mint: [159, 232, 201], paper: [250, 249, 246], rust: [168, 84, 47], ink: [16, 27, 23], mute: [94, 110, 102], white: [255, 255, 255], pale: [237, 241, 236] };
const stage = document.getElementById('stage'), world = document.getElementById('world');

/* ---------------- building blocks ---------------- */
const ALL = [];
function el(parent, html = '', cls = '', style = '') {
  const e = document.createElement('div');
  e.className = 'L ' + cls; e.innerHTML = html; e.style.cssText += style;
  parent.appendChild(e); ALL.push(e); return e;
}
function group(z) { const g = document.createElement('div'); g.className = 'g'; g.style.zIndex = z; world.appendChild(g); g.style.display = 'none'; ALL.push(g); return g; }
function put(e, o = {}) {
  const { x = 0, y = 0, s = 1, sx = s, sy = s, r = 0, o: op = 1, z = null, ox = null, oy = null } = o;
  if (op <= 0.003) { e.style.display = 'none'; return; }
  e.style.display = 'block';
  e.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${sx},${sy})`;
  e.style.transformOrigin = `${ox ?? (e._w || 0) / 2}px ${oy ?? (e._h || 0) / 2}px`;
  e.style.opacity = Math.min(1, op);
  if (z !== null) e.style.zIndex = z;
}
const rise = (t, t0, d, p = 'default') => d * (1 - sp(t - t0, p));
const op = (t, t0, p = 'snappy') => sp(t - t0, p);
const press = (t, t0, depth = 0.93) => T(t, 1, [[t0, depth, 'snappy'], [t0 + 0.12, 1, 'snappy']]);
const pop = (t, t0, from = 0.4, p = 'default') => T(t, from, [[t0, 1, p]]);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
function setDraw(p, k) { const L = p._len || (p._len = p.getTotalLength() + 2); p.style.strokeDasharray = `${L} ${L}`; p.style.strokeDashoffset = L * (1 - Math.max(0, Math.min(1, k))); p.style.visibility = k <= 0.001 ? 'hidden' : 'visible'; }

// typed text: parts like [['Know the'], ['\n'], ['condition?', 'em']]
function typed(e, parts, t, t0, cps, caretFor = 0.7) {
  const total = parts.reduce((a, p) => a + (p[0] === '\n' ? 0 : p[0].length), 0);
  const n = Math.max(0, Math.min(total, Math.floor((t - t0) * cps)));
  let left = n, html = '';
  for (const [s, em] of parts) {
    if (s === '\n') { html += '<br>'; continue; }
    const part = s.slice(0, Math.max(0, left)); left -= s.length;
    if (part) html += em ? `<em>${esc(part)}</em>` : esc(part);
  }
  const done = t0 + total / cps;
  const caret = t >= t0 && (t < done || (t < done + caretFor && Math.floor((t - done) * 4) % 2 === 0));
  e.innerHTML = html + (caret ? '<span class="caret"></span>' : '');
  return n / total;
}
// word-by-word reveal (words wrapped once in .w spans)
function wrapWords(e) { e.innerHTML = e.innerHTML.replace(/(<em>)?([^\s<]+)(<\/em>)?/g, (m) => `<span class="w">${m}</span>`); }
function words(e, t, t0, step = 0.05, d = 60, p = 'default') {
  [...e.querySelectorAll('.w')].forEach((w, i) => { const k = sp(t - t0 - i * step, p); w.style.opacity = Math.min(1, k * 1.5); w.style.transform = `translateY(${d * (1 - k)}px)`; });
}

/* ---------------- icons (original line drawings) ---------------- */
const ICON = {
  search: '<circle cx="26" cy="26" r="16" fill="none" stroke-width="6"/><path d="M38 38 L54 54" stroke-width="6"/>',
  legs: '<path d="M22 6 L30 30 L22 58"/><circle cx="30" cy="30" r="6"/><path d="M40 8 L36 30 L42 58"/>',
  skin: '<path d="M32 8 C22 24 16 32 16 40 a16 16 0 0 0 32 0 C48 32 42 24 32 8Z"/>',
  tummy: '<path d="M32 12 a20 20 0 1 1 -19 14"/><path d="M32 24 a8 8 0 1 1 -8 8"/>',
  eyes: '<path d="M6 32 C18 16 46 16 58 32 C46 48 18 48 6 32Z"/><circle cx="32" cy="32" r="7"/>',
  tooth: '<path d="M18 12 C24 8 28 12 32 12 C36 12 40 8 46 12 C54 18 49 30 47 38 C45 48 43 56 39 56 C35 56 35 42 32 42 C29 42 29 56 25 56 C21 56 19 48 17 38 C15 30 10 18 18 12Z"/>',
  spine: '<rect x="22" y="6" width="20" height="10" rx="4"/><rect x="21" y="20" width="22" height="10" rx="4"/><rect x="21" y="34" width="22" height="10" rx="4"/><rect x="22" y="48" width="20" height="10" rx="4"/>',
  mood: '<path d="M6 34 C12 18 20 18 24 32 S34 48 40 32 S52 16 58 32"/>',
  pulse: '<path d="M4 32 H18 L25 14 L34 50 L41 32 H60"/>',
  sparkle: '<path d="M32 6 C34 24 40 30 58 32 C40 34 34 40 32 58 C30 40 24 34 6 32 C24 30 30 24 32 6Z"/>',
  camera: '<rect x="6" y="18" width="52" height="36" rx="8"/><path d="M22 18 L26 10 H38 L42 18"/><circle cx="32" cy="36" r="10"/>',
  check: '<path d="M16 33 L27 44 L48 21"/>',
  arrow: '<path d="M12 32 H50 M36 18 L50 32 L36 46"/>',
  send: '<path d="M14 32 H48 M34 18 L48 32 L34 46"/>',
  bottle: '<rect x="30" y="8" width="20" height="10" rx="3"/><path d="M33 18 V26 C24 30 22 36 22 44 V80 C22 86 26 88 32 88 H48 C54 88 58 86 58 80 V44 C58 36 56 30 47 26 V18"/><rect x="26" y="50" width="28" height="22" rx="4"/>',
  tub: '<rect x="14" y="22" width="68" height="14" rx="5"/><path d="M18 36 V76 C18 84 24 86 30 86 H66 C72 86 78 84 78 76 V36"/><path d="M30 56 H66"/>',
  harness: '<path d="M16 68 C16 38 80 38 80 68"/><path d="M34 44 C34 18 62 18 62 44"/><rect x="40" y="56" width="16" height="12" rx="3"/><path d="M16 68 V78 M80 68 V78"/>',
  ramp: '<path d="M8 82 L60 40 H88 V82 Z"/><path d="M22 70 L28 76 M34 60 L40 66 M46 50 L52 56"/>',
  brace: '<rect x="28" y="10" width="40" height="76" rx="14"/><path d="M20 30 H76 M20 50 H76 M20 70 H76"/>',
  chew: '<rect x="12" y="28" width="72" height="40" rx="20"/><circle cx="32" cy="48" r="4"/><circle cx="48" cy="44" r="4"/><circle cx="64" cy="50" r="4"/>',
};
function icon(name, size, color, sw = 5, vb = null) {
  const v = vb || (['bottle', 'tub', 'harness', 'ramp', 'brace', 'chew'].includes(name) ? 96 : 64);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${v} ${v}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICON[name]}</svg>`;
}
const STAR = '<svg width="110" height="110" viewBox="0 0 64 64"><path d="M32 4 L40 23 L60 24 L44 37 L50 58 L32 46 L14 58 L20 37 L4 24 L24 23 Z" fill="#C9982E"/></svg>';
function mark(size, bg, fg) { // the Poorly Pet mark: rounded square with a plus
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="${bg}"/><rect class="plusv" x="42" y="22" width="16" height="56" rx="6" fill="${fg}"/><rect class="plush" x="22" y="42" width="56" height="16" rx="6" fill="${fg}"/></svg>`;
}

/* ================= SCENE A: hook ================= */
const A = group(10);
const aBg = el(A, '', 'full', 'background:var(--paper)');
const a2am = el(A, "<span class='w'>It's</span> <span class='w'>2am.</span>", 'disp', 'font-size:230px;color:var(--ink)');
const aBar = el(A, `<div style="position:absolute;left:44px;top:43px">${icon('search', 64, '#5E6E66', 6)}</div><div class="aq ui" style="position:absolute;left:136px;top:44px;font:500 60px/64px Inter;color:var(--ink);white-space:nowrap"></div>`,
  'card', 'width:960px;height:160px;border-radius:80px;border:4px solid var(--ink)');
const aQ = aBar.querySelector('.aq');
const TABS = ["10 causes of limping", "Is it serious??", "Forum: 243 replies", "Could be anything", "Try this ONE trick", "Just wait 2 weeks?", "Vet bills explained", "Joint or paw?", "Sponsored", "Read before panicking", "Page 7 of 40", "Ask your vet?"];
const TABPOS = [[70, 250, -8], [590, 210, 6], [320, 470, -3], [40, 700, 5], [610, 660, -6], [330, 900, 4], [60, 1120, -5], [590, 1090, 7], [330, 1330, -4], [40, 1560, 6], [600, 1530, -7], [320, 1720, 3]];
const aTabs = TABS.map((tt, i) => el(A, `<div style="position:absolute;left:26px;top:24px;display:flex;gap:10px">${['#E0735A', '#E9C46A', '#9FE8C9'].map(c => `<i style="width:16px;height:16px;border-radius:8px;background:${c};display:block"></i>`).join('')}</div>
  <div class="bar" style="left:110px;top:25px;width:260px;height:14px"></div>
  <div class="ui" style="position:absolute;left:28px;top:66px;font:700 40px/1.1 Inter;color:${i === 8 ? 'var(--rust)' : 'var(--ink)'};white-space:nowrap">${tt}</div>
  <div class="bar" style="left:28px;top:130px;width:360px"></div><div class="bar" style="left:28px;top:156px;width:250px"></div>`, 'card', 'width:440px;height:196px;box-shadow:0 10px 30px rgba(16,27,23,.10)'));
const aBand = el(A, '', '', 'width:1080px;height:390px;background:var(--ink)');
const aQ2 = el(A, 'Where do you<br><em>even start?</em>', 'disp', 'font-size:150px;color:#fff');
aQ2.querySelector('em').style.color = 'var(--mint)';
const aMark = el(A, mark(200, '#C25E2E', '#fff'), '', 'width:200px;height:200px');

function sceneA(t) {
  if (t > 3.75) return;
  put(A);
  put(aBg);
  put(a2am, { x: 56, y: 560 + T(t, 0, [[1.4, -930, 'default']]) }); words(a2am, t, -0.12, 0.12, 130, 'heavy');
  const barY = 900 + rise(t, -0.2, 200) + T(t, 0, [[1.4, -820, 'default']]);
  put(aBar, { x: 60, y: barY, s: press(t, 1.22, 0.96), ox: 480, oy: 75 });
  typed(aQ, [['why is my dog limping']], t, 0.25, 22);
  aTabs.forEach((c, i) => {
    const t0 = 1.5 + i * 0.0625, [x, y, r] = TABPOS[i];
    put(c, { x, y: y + rise(t, t0, 60, 'snappy'), s: pop(t, t0, 0.3), r: r * sp(t - t0, 'default'), o: op(t, t0), ox: 220, oy: 98 });
  });
  const bx = T(t, -1080, [[2.3, 0, 'default']]);
  put(aBand, { x: bx, y: 760 });
  put(aQ2, { x: 60 + bx * 1.15, y: 800 });
  // the mark pops, then swallows the screen
  const ms = pop(t, 2.95, 0, 'default') * T(t, 1, [[3.15, 13, 'heavy']]);
  put(aMark, { x: 440, y: 860, s: ms, ox: 100, oy: 100 });
  const pk = T(t, 1, [[3.1, 0, 'snappy']]);
  aMark.querySelector('.plusv').setAttribute('transform', `translate(50 50) scale(${pk}) translate(-50 -50)`);
  aMark.querySelector('.plush').setAttribute('transform', `translate(50 50) scale(${pk}) translate(-50 -50)`);
}

/* ================= SCENE B: brand ================= */
const B = group(20);
const bBg = el(B, '', 'full', 'background:#C25E2E');
const bMark = el(B, mark(150, '#fff', '#C25E2E'), '', 'width:150px;height:150px');
const bWord = el(B, 'Poorly Pet', 'ui', 'font:800 120px/150px Inter;color:#fff;letter-spacing:-.02em;white-space:nowrap');
const bH1 = el(B, "<span class='w'>Pet</span> <span class='w'>health.</span>", 'disp', 'font-size:190px;color:#fff');
const bH2 = el(B, "<span class='w'>Made</span> <span class='w'><em>easier.</em></span>", 'disp', 'font-size:190px;color:#fff');
const bUnder = el(B, '<svg width="560" height="60" viewBox="0 0 560 60"><path d="M8 40 C120 18 300 14 552 30" fill="none" stroke="#0B2A23" stroke-width="16" stroke-linecap="round"/></svg>');
const bSub = el(B, "The UK's pet health &amp; recovery specialist.", 'ui', 'font:500 46px/1.3 Inter;color:rgba(255,255,255,.92);width:960px');
const FEATS = ['Shop by condition', 'Shop by symptom', 'AI care assistant', 'AI symptom scanner'];
const bChips = FEATS.map(f => el(B, f, 'pill', 'background:#fff;color:#A8542F;font-size:44px'));
function sceneB(t) {
  if (t < 3.4 || t > 6.6) return;
  const gy = T(t, 0, [[5.85, -1920, 'default']]);
  put(B, { y: gy, ox: 0, oy: 0 });
  put(bBg);
  put(bMark, { x: 60, y: 660, s: pop(t, 3.6, 0.3, 'heavy'), o: op(t, 3.6) });
  put(bWord, { x: 240, y: 660, o: op(t, 3.7) });
  bWord.style.clipPath = `inset(-10% ${100 - 100 * sp(t - 3.72, 'default')}% -10% 0)`;
  put(bH1, { x: 52, y: 900 }); words(bH1, t, 4.1, 0.12, 120, 'heavy');
  put(bH2, { x: 52, y: 1090 }); words(bH2, t, 4.35, 0.12, 120, 'heavy');
  put(bUnder, { x: 52 + (bH2._emX || 430) - 10, y: 1265 });
  setDraw(bUnder.querySelector('path'), sp(t - 4.7, 'heavy'));
  put(bSub, { x: 60, y: 1390 + rise(t, 5.0, 40), o: op(t, 5.0) });
  bChips.forEach((c, i) => {
    const t0 = 5.25 + i * 0.125, [x, y] = bChips._pos[i];
    put(c, { x, y: y + rise(t, t0, 50, 'snappy'), s: pop(t, t0, 0.5), o: op(t, t0) });
  });
}

/* ================= SCENE C: shop by condition ================= */
const Cg = group(15);
const cBg = el(Cg, '', 'full', 'background:var(--paper)');
const cEye = el(Cg, '01 — Shop by condition', 'eyebrow', 'color:var(--rust)');
const cH = el(Cg, '', 'disp', 'font-size:170px;color:var(--ink)');
const CONDS = ['Arthritis', 'Hip dysplasia', 'IVDD', 'Cruciate ligament', 'Luxating patella', 'Elbow dysplasia', 'Back pain', 'Spondylosis', 'Knuckling', 'Itchy skin', 'Hot spots', 'Anxiety & stress', 'Dental disease', 'Digestive issues', 'Kidney disease', 'Wound care'];
const cPills = CONDS.map((n, i) => el(Cg, esc(n), 'pill', 'font-size:52px;padding:28px 42px;' + (i === 0 ? 'background:var(--green);color:#fff' : i % 3 === 1 ? 'background:var(--pale);color:var(--ink)' : 'border:4px solid var(--green);color:var(--green)')));
const cCount = el(Cg, '25 conditions · 8 care areas', 'ui', 'font:600 44px/1 Inter;color:var(--mute);white-space:nowrap');
const cCard = el(Cg, '', 'card', 'border:3px solid var(--green)');
const cDesc = el(Cg, 'Joint wear that brings stiffness<br>and pain, especially after rest.', 'ui', 'font:600 44px/1.25 Inter;color:var(--ink)');
const cSignsL = el(Cg, 'Signs to look for', 'eyebrow', 'font-size:28px;color:var(--rust)');
const cSigns = ['Stiff after rest', 'Slowing on walks', 'Reluctant to jump'].map(s => el(Cg, s, 'pill', 'font-size:32px;padding:18px 26px;background:var(--pale);color:var(--ink)'));
const cMatchL = el(Cg, 'Matched support', 'eyebrow', 'font-size:28px;color:var(--rust)');
const PRODS = ['tub', 'bottle', 'harness', 'ramp'];
const cProds = PRODS.map(p => el(Cg, `<div style="position:absolute;inset:0;border-radius:24px;background:var(--pale)"></div><div style="position:absolute;left:47px;top:30px">${icon(p, 110, '#0C342A', 5)}</div><div class="bar" style="left:22px;top:156px;width:150px;background:#D6DEDA"></div><div class="bar" style="left:22px;top:180px;width:100px;background:#D6DEDA"></div>`, '', 'width:205px;height:210px'));
const cBtn = el(Cg, `Shop products <span style="display:inline-block;vertical-align:-10px">${icon('arrow', 44, '#fff', 6)}</span>`, 'pill', 'background:var(--green);color:#fff;font-size:42px;padding:26px 40px');
function sceneC(t) {
  if (t < 5.8 || t > 10.7) return;
  const gx = T(t, 0, [[10.2, -1080, 'default']]);
  put(Cg, { x: gx, ox: 0, oy: 0 });
  put(cBg);
  put(cEye, { x: 60, y: 250 + rise(t, 6.0, 30), o: op(t, 6.0) });
  put(cH, { x: 56, y: 320 }); typed(cH, [['Know the'], ['\n'], ['condition?', 1]], t, 6.05, 34);
  const sel = t >= 8.1;
  cPills.forEach((p, i) => {
    const t0 = 6.75 + i * 0.0625, [x, y] = cPills._pos[i];
    if (i === 0) return;
    const drop = T(t, 0, [[8.15 + (i % 5) * 0.03, 1500, 'default']]);
    put(p, { x, y: y + drop, s: pop(t, t0, 0.2, 'default') * (sel ? 1 : 1), r: sel ? (i % 2 ? 6 : -6) * sp(t - 8.15, 'default') : 0, o: op(t, t0) });
  });
  put(cCount, { x: 60, y: cPills._bottom + 40 + rise(t, 7.9, 30) + T(t, 0, [[8.15, 1400, 'default']]), o: op(t, 7.9) });
  // Arthritis: pressed, then its pill morphs into the card
  const [px, py] = cPills._pos[0], pw = cPills[0]._w, ph = cPills[0]._h;
  const k = sp(t - 8.2, 'default');
  const cx = px + (60 - px) * k, cy = py + (700 - py) * k, cw = pw + (960 - pw) * k, ch = ph + (1000 - ph) * k;
  if (t >= 8.2) { cCard.style.width = cw + 'px'; cCard.style.height = ch + 'px'; cCard.style.borderRadius = (ph / 2) * (1 - k) + 36 * k + 'px'; put(cCard, { x: cx, y: cy, ox: 0, oy: 0 }); }
  put(cPills[0], { x: px + (100 - px) * k, y: py + (740 - py) * k, s: press(t, 7.95, 0.9) * pop(t, 6.75, 0.2), o: op(t, 6.75), z: 5 });
  put(cDesc, { x: 100, y: 860 + rise(t, 8.4, 40), o: op(t, 8.4), z: 5 });
  put(cSignsL, { x: 100, y: 1020 + rise(t, 8.5, 30), o: op(t, 8.5), z: 5 });
  let sx = 100;
  cSigns.forEach((c, i) => { const t0 = 8.55 + i * 0.0625; put(c, { x: sx, y: 1070, s: pop(t, t0, 0.3), o: op(t, t0), z: 5 }); sx += c._w + 14; });
  put(cMatchL, { x: 100, y: 1200 + rise(t, 8.8, 30), o: op(t, 8.8), z: 5 });
  cProds.forEach((c, i) => { const t0 = 8.875 + i * 0.125; put(c, { x: 100 + i * 225, y: 1250 + rise(t, t0, 80, 'snappy'), s: pop(t, t0, 0.5), o: op(t, t0), z: 5 }); });
  put(cBtn, { x: 100, y: 1540, s: pop(t, 9.3125, 0.5) * press(t, 9.7, 0.93), o: op(t, 9.3125), z: 5 });
}

/* ================= SCENE D: shop by symptom ================= */
const D = group(30);
const dBg = el(D, '', 'full', 'background:var(--deep)');
const dEye = el(D, '02 — Shop by symptom', 'eyebrow', 'color:var(--mint)');
const dH = el(D, '', 'disp', 'font-size:160px;color:#fff');
const AREAS = [['legs', 'Legs & paws', 'Knees, hips, movement'], ['skin', 'Skin & coat', 'Itching, redness, coat'], ['tummy', 'Tummy & gut', 'Digestion and appetite'], ['eyes', 'Ears & eyes', 'Face, ears and head'],
  ['tooth', 'Mouth & teeth', 'Breath, gums, chewing'], ['spine', 'Back & spine', 'Posture and back pain'], ['mood', 'Behaviour & mood', 'Stress and restlessness'], ['pulse', 'Whole body', 'Recovery and wellbeing']];
