<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5 Things Itchy Skin</title>
<style>
@font-face{font-family:Fraunces;font-style:normal;font-weight:300 700;src:url(fonts/fraunces-normal.woff2) format('woff2')}
@font-face{font-family:Fraunces;font-style:italic;font-weight:300 700;src:url(fonts/fraunces-italic.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:400 800;src:url(fonts/inter-normal.woff2) format('woff2')}
:root{--deep:#0B2A23;--green:#0C342A;--tile:#134A3D;--rust:#A8542F;--mark:#C25E2E;--mint:#9FE8C9;--paper:#FAF9F6;--pale:#EDF1EC;--ink:#101B17;--mute:#5E6E66;--line:#E3E8E6;--gold:#C9982E}
html,body{margin:0;height:100%;background:#111;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--deep);transform-origin:0 0}
.g{position:absolute;left:0;top:0;width:1080px;height:1920px}
.L{position:absolute;left:0;top:0;display:none}
.full{width:1080px;height:1920px}
.disp{font-family:Fraunces,serif;font-weight:560;font-optical-sizing:auto;letter-spacing:-.02em;line-height:.98;white-space:nowrap}
.disp em{font-style:italic;font-weight:480}
.ln{display:block;width:max-content}
.w{display:inline-block}
.ui{font-family:Inter,sans-serif}
.caret{display:inline-block;width:4px;height:.9em;margin-left:3px;background:var(--deep);vertical-align:-.1em}
.card{background:#fff;box-sizing:border-box;box-shadow:0 26px 60px rgba(11,42,35,.16),0 4px 12px rgba(11,42,35,.06)}
.pill{font-family:Inter,sans-serif;border-radius:999px;white-space:nowrap;box-sizing:border-box}
.five{display:inline-block;background:var(--mark);color:#fff;border-radius:.2em;padding:0 .14em;margin-right:.08em;line-height:1.02}
.tnum{font-variant-numeric:tabular-nums}
svg{display:block;overflow:visible}
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/motion.js"></script>
<script src="cues.js"></script>
<script>
const { spring: sp, track: T, mix } = Motion;
const { B, S0, ITEM, P1, P2, END, TYPE_BEATS } = window.TL;
const W = 1080, H = 1920, FPS = 30, DUR = Math.round(TL.DUR * FPS) / FPS;
const b = n => n * B;                       // beats to seconds
const C = { deep: [11, 42, 35], tile: [19, 74, 61], mint: [159, 232, 201], paper: [250, 249, 246], rust: [168, 84, 47], mark: [194, 94, 46], ink: [16, 27, 23], mute: [94, 110, 102], white: [255, 255, 255], pale: [237, 241, 236], track: [228, 233, 230] };
const stage = document.getElementById('stage');
const lerp = (a, c, k) => a + (c - a) * k;

/* ---------------- building blocks ---------------- */
const ALL = [];
function el(parent, html = '', cls = '', style = '') {
  const e = document.createElement('div');
  e.className = 'L ' + cls; e.innerHTML = html; e.style.cssText += style;
  parent.appendChild(e); ALL.push(e); return e;
}
function group(z) { const g = document.createElement('div'); g.className = 'g'; g.style.zIndex = z; g.style.display = 'none'; stage.appendChild(g); ALL.push(g); return g; }
function put(e, o = {}) {
  const { x = 0, y = 0, s = 1, sx = s, sy = s, r = 0, o: op = 1, ox = null, oy = null } = o;
  if (op <= 0.003) { e.style.display = 'none'; return; }
  e.style.display = 'block';
  e.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${sx},${sy})`;
  e.style.transformOrigin = `${ox ?? (e._w || 0) / 2}px ${oy ?? (e._h || 0) / 2}px`;
  e.style.opacity = Math.min(1, op);
}
const rise = (t, t0, d, p = 'default') => d * (1 - sp(t - t0, p));
const op = (t, t0, p = 'snappy') => sp(t - t0, p);
const press = (t, t0, depth = 0.93) => T(t, 1, [[t0, depth, 'snappy'], [t0 + 0.1, 1, 'snappy']]);
const pop = (t, t0, from = 0.4, p = 'default') => T(t, from, [[t0, 1, p]]);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
function setDraw(p, k) { const L = p._len || (p._len = p.getTotalLength() + 2); p.style.strokeDasharray = `${L} ${L}`; p.style.strokeDashoffset = L * (1 - Math.max(0, Math.min(1, k))); p.style.visibility = k <= 0.001 ? 'hidden' : 'visible'; }
function typed(e, text, t, t0, cps, caretFor = 0.6) {
  const n = Math.max(0, Math.min(text.length, Math.floor((t - t0) * cps)));
  const done = t0 + text.length / cps;
  const caret = t >= t0 && (t < done || (t < done + caretFor && Math.floor((t - done) * 4) % 2 === 0));
  e.innerHTML = esc(text.slice(0, n)) + (caret ? '<span class="caret"></span>' : '');
}
function wrapWords(e) { e.innerHTML = e.innerHTML.replace(/(<em>)?([^\s<]+)(<\/em>)?/g, m => `<span class="w">${m}</span>`); }
function words(e, t, t0, step = 0.06, d = 110, p = 'default') {
  [...e.querySelectorAll('.w')].forEach((w, i) => { const k = sp(t - t0 - i * step, p); w.style.opacity = Math.min(1, k * 1.6); w.style.transform = `translateY(${d * (1 - k)}px)`; });
}

/* ---------------- icons and product illustrations (original drawings, no animals) ---------------- */
const CHECK = (s, c, sw = 7) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><path class="ckp" d="M16 33 L27 44 L48 21"/></svg>`;
const ARROW = (s, c, sw = 7) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><path d="M10 32 H52 M36 16 L52 32 L36 48"/></svg>`;
const CARTICON = (s, c) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10 H14 L20 40 H50 L56 18 H17"/><circle cx="24" cy="52" r="4.5"/><circle cx="46" cy="52" r="4.5"/></svg>`;
const BOOKMARK = s => `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><path class="bmk" d="M16 8 H48 V58 L32 46 L16 58 Z" fill="none" stroke="#9FE8C9" stroke-width="5.5" stroke-linejoin="round"/></svg>`;
const TRUCK = s => `<svg width="${s}" height="${s}" viewBox="0 0 64 64" fill="none" stroke="#9FE8C9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16 H38 V44 H4 Z M38 26 H50 L58 36 V44 H38"/><circle cx="16" cy="48" r="5" fill="#0B2A23"/><circle cx="48" cy="48" r="5" fill="#0B2A23"/></svg>`;
const STAR = (s, fill) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><path d="M32 4 L40 23 L60 24 L44 37 L50 58 L32 46 L14 58 L20 37 L4 24 L24 23 Z" fill="${fill}"/></svg>`;
function mark(size, bg, fg) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="${bg}"/><g class="plus"><rect x="42" y="22" width="16" height="56" rx="6" fill="${fg}"/><rect x="22" y="42" width="56" height="16" rx="6" fill="${fg}"/></g>
    <path class="ck" d="M27 52 L43 67 L74 34" fill="none" stroke="${fg}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" style="visibility:hidden"/></svg>`;
}
const SHADOW = '<ellipse cx="100" cy="250" rx="66" ry="7" fill="rgba(11,42,35,.13)"/>';
const ILL = {
  // 1. salmon oil: pump bottle
  oil: `<defs><linearGradient id="gOil" x1="0" x2="1"><stop offset="0" stop-color="#D7783F"/><stop offset="1" stop-color="#A8542F"/></linearGradient></defs>${SHADOW}
    <path d="M78 20 H146 a8 8 0 0 1 0 16 H113 V54 H87 V36 H78 a8 8 0 0 1 0 -16Z" fill="#101B17"/>
    <rect x="72" y="52" width="56" height="20" rx="6" fill="#0B2A23"/>
    <path d="M84 72 H116 V88 C140 94 152 106 152 126 V226 a20 20 0 0 1 -20 20 H68 a20 20 0 0 1 -20 -20 V126 C48 106 60 94 84 88Z" fill="url(#gOil)"/>
    <rect x="62" y="134" width="76" height="88" rx="10" fill="#FAF9F6"/>
    <path d="M100 146 C91 159 87 165 87 173 a13 13 0 0 0 26 0 C113 165 109 159 100 146Z" fill="#C25E2E"/>
    <rect x="74" y="196" width="52" height="7" rx="3.5" fill="#0B2A23"/><rect x="82" y="208" width="36" height="6" rx="3" fill="#9AA8A1"/>
    <rect x="56" y="114" width="9" height="104" rx="4.5" fill="#fff" opacity=".3"/>`,
  // 2. itch relief balm: tin with a chamomile flower
  tin: `${SHADOW}
    <path d="M22 150 V214 a78 22 0 0 0 156 0 V150Z" fill="#9FE8C9"/>
    <path d="M22 150 V160 a78 22 0 0 0 156 0 V150Z" fill="#7FD3B0"/>
    <path d="M18 120 V150 a82 22 0 0 0 164 0 V120Z" fill="#0C342A"/>
    <ellipse cx="100" cy="120" rx="82" ry="22" fill="#134A3D"/>
    <ellipse cx="100" cy="117" rx="62" ry="13" fill="none" stroke="#9FE8C9" stroke-width="3" opacity=".55"/>
    <g transform="translate(100 196)">${[0, 1, 2, 3, 4, 5, 6, 7].map(k => `<ellipse cx="0" cy="-15" rx="6.5" ry="12" fill="#fff" transform="rotate(${k * 45})"/>`).join('')}<circle r="8.5" fill="#C9982E"/></g>
    <rect x="36" y="160" width="8" height="52" rx="4" fill="#fff" opacity=".35"/>`,
  // 3. oatmeal shampoo: flip-cap bottle with an oat sprig
  shampoo: `${SHADOW}
    <rect x="70" y="18" width="60" height="48" rx="11" fill="#0B2A23"/><rect x="70" y="34" width="60" height="5" fill="#134A3D"/>
    <path d="M60 64 H140 C153 64 158 74 158 88 V226 a20 20 0 0 1 -20 20 H62 a20 20 0 0 1 -20 -20 V88 C42 74 47 64 60 64Z" fill="#F2E7CF"/>
    <rect x="56" y="112" width="88" height="106" rx="12" fill="#9FE8C9"/>
    <path d="M100 206 C100 180 100 158 102 132" fill="none" stroke="#0B2A23" stroke-width="4" stroke-linecap="round"/>
    ${[[-1, 140], [1, 150], [-1, 160], [1, 170], [-1, 180]].map(([d, y]) => `<ellipse cx="${101 + d * 11}" cy="${y}" rx="6" ry="11" fill="#C9982E" transform="rotate(${d * 32} ${101 + d * 11} ${y})"/>`).join('')}
    <rect x="50" y="78" width="9" height="140" rx="4.5" fill="#fff" opacity=".55"/>`,
  // 4. hot spot & itch relief spray: trigger bottle
  spray: `${SHADOW}
    <path d="M66 42 H138 a10 10 0 0 1 10 10 V58 H164 V76 H142 L128 98 H74 a8 8 0 0 1 -8 -8 Z" fill="#9FE8C9"/>
    <path d="M114 98 C106 112 106 126 114 138 L124 134 C118 122 120 110 128 100Z" fill="#0B2A23"/>
    <rect x="78" y="96" width="44" height="20" rx="5" fill="#0B2A23"/>
    <path d="M66 114 H134 C147 114 154 124 154 136 V226 a20 20 0 0 1 -20 20 H66 a20 20 0 0 1 -20 -20 V136 C46 124 53 114 66 114Z" fill="#134A3D"/>
    <rect x="60" y="152" width="80" height="72" rx="10" fill="#FAF9F6"/>
    <path d="M100 162 C93 172 90 177 90 183 a10 10 0 0 0 20 0 C110 177 107 172 100 162Z" fill="#9FE8C9" stroke="#134A3D" stroke-width="3"/>
    <rect x="76" y="202" width="48" height="7" rx="3.5" fill="#0B2A23"/>
    ${[[176, 60, 5], [188, 70, 4], [180, 80, 3.5], [194, 56, 3]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#9FE8C9"/>`).join('')}
    <rect x="54" y="132" width="8" height="90" rx="4" fill="#fff" opacity=".22"/>`,
  // 5. itch relief chews: stand-up pouch with a window
  pouch: `${SHADOW}
    <path d="M42 36 H158 L162 212 C162 232 152 246 132 246 H68 C48 246 38 232 38 212Z" fill="#0C342A"/>
    <rect x="42" y="36" width="116" height="20" fill="#134A3D"/><path d="M42 46 h6 M152 46 h6" stroke="#0B2A23" stroke-width="3"/>
    <rect x="52" y="66" width="96" height="4" rx="2" fill="#134A3D"/>
    <rect x="60" y="98" width="80" height="90" rx="40" fill="#FAF9F6"/>
    <rect x="72" y="118" width="34" height="22" rx="11" fill="#C25E2E" transform="rotate(-14 89 129)"/>
    <rect x="98" y="136" width="32" height="21" rx="10.5" fill="#C9982E" transform="rotate(12 114 146)"/>
    <rect x="74" y="152" width="30" height="20" rx="10" fill="#A8542F" transform="rotate(6 89 162)"/>
    <rect x="70" y="204" width="60" height="9" rx="4.5" fill="#9FE8C9"/><rect x="80" y="220" width="40" height="7" rx="3.5" fill="#134A3D"/>
    <rect x="48" y="84" width="8" height="120" rx="4" fill="#fff" opacity=".18"/>`,
  // bundle extra: itch & allergy drops, dropper bottle
  drops: `<defs><linearGradient id="gDrop" x1="0" x2="1"><stop offset="0" stop-color="#B9652F"/><stop offset="1" stop-color="#8E4424"/></linearGradient></defs>${SHADOW}
    <path d="M86 62 V36 a14 14 0 0 1 28 0 V62Z" fill="#101B17"/>
    <rect x="74" y="60" width="52" height="26" rx="6" fill="#0B2A23"/>
    <path d="M72 86 H128 C146 92 156 104 156 122 V226 a20 20 0 0 1 -20 20 H64 a20 20 0 0 1 -20 -20 V122 C44 104 54 92 72 86Z" fill="url(#gDrop)"/>
    <rect x="58" y="136" width="84" height="84" rx="10" fill="#FAF9F6"/>
    <path d="M100 150 C112 156 118 168 112 182 C104 178 96 168 100 150Z M100 150 C88 156 82 168 88 182 C96 178 104 168 100 150Z" fill="#134A3D"/>
    <rect x="76" y="196" width="48" height="7" rx="3.5" fill="#0B2A23"/>
    <rect x="52" y="114" width="8" height="104" rx="4" fill="#fff" opacity=".28"/>`,
};
let illN = 0;
const ill = (k, w) => { const n = ++illN; return `<svg width="${w}" height="${w * 1.3}" viewBox="0 0 200 260">${ILL[k].replace(/id="(\w+)"/g, `id="$1_${n}"`).replace(/url\(#(\w+)\)/g, `url(#$1_${n})`)}</svg>`; };

/* ---------------- content (all from DATA-PACK.md, Itchy skin) ---------------- */
const ITEMS = [
  { name: [['Salmon oil'], ['every day', 1]], prod: 'Scottish Salmon Oil', eyebrow: 'For dogs &amp; cats', tag: 'BEST SELLER', price: 9.99, chip: 'Rich in Omega-3', ill: 'oil', theme: 'paper', enter: 'left' },
  { name: [['Itch Relief'], ['Balm', 1]], prod: 'Itch Relief Balm', eyebrow: 'Natural &amp; organic', tag: '60ML', price: 9.99, chip: 'Soothes redness, hydrates dry skin', ill: 'tin', theme: 'mint', enter: 'up' },
  { name: [['A gentle'], ['oatmeal wash', 1]], prod: 'Oatmeal Dog Shampoo', eyebrow: 'For sensitive skin', tag: '500ML', price: 9.99, chip: 'Colloidal oatmeal &amp; aloe vera', ill: 'shampoo', theme: 'deep', enter: 'wipe' },
  { name: [['Hot Spot &amp;'], ['Itch Spray', 1]], prod: 'Hot Spot &amp; Itch Relief Spray', eyebrow: 'Spray on and leave', tag: '250ML', price: 12.99, chip: 'No steroids, no rinse', ill: 'spray', theme: 'paper', enter: 'left' },
  { name: [['Itch Relief'], ['Chews', 1]], prod: 'Itch Relief Chews', eyebrow: 'Skin &amp; allergy support', tag: 'BEST SELLER', price: 29.99, chip: 'Itch relief from the inside out', ill: 'pouch', theme: 'mint', enter: 'wipeR' },
];
const THEMES = {
  paper: { wm: '#F0ECE3', bg: '#FAF9F6', text: '#101B17', acc: '#A8542F', num: [194, 94, 46], badge: [11, 42, 35], badgeNum: [159, 232, 201], well: '#EDF1EC', s1: '#ECE8DF', s2: '#E1DCD0', chip: '#E3F7EE', toastBg: '#101B17', toastFg: '#fff', toastCk: '#9FE8C9' },
  mint: { wm: '#8EDDBB', bg: '#9FE8C9', text: '#0B2A23', acc: '#0B2A23', num: [11, 42, 35], badge: [11, 42, 35], badgeNum: [159, 232, 201], well: '#E7F8F0', s1: '#8BDDBA', s2: '#76CFA8', chip: '#E3F7EE', toastBg: '#0B2A23', toastFg: '#fff', toastCk: '#9FE8C9' },
  deep: { wm: '#123B31', bg: '#0B2A23', text: '#FAF9F6', acc: '#9FE8C9', num: [159, 232, 201], badge: [159, 232, 201], badgeNum: [11, 42, 35], well: '#EDF1EC', s1: '#134A3D', s2: '#1A5848', chip: '#E3F7EE', toastBg: '#9FE8C9', toastFg: '#0B2A23', toastCk: '#0B2A23' },
};
const lines = ls => ls.map(([s, em]) => `<div class="ln">${s.split(' ').map(w => `<span class="w">${em ? `<em>${w}</em>` : w}</span>`).join(' ')}</div>`).join('');
const start = i => b(S0 + i * ITEM);                         // item i lands on this downbeat
const CX = 64, CY = 650, CW = 876, CH = 680;                 // product card
const BADGE = { cx: 502, cy: 980, d: 470 };                  // number badge before it opens
const STEP = { x: 64, y: 226, w: 876, h: 84 };               // progress tracker
const CART = { x: STEP.x + 788, y: STEP.y + 10, d: 64 };     // cart button inside the tracker
const ADD = { x: CX + 32 + 256, y: CY + 32 + 306, d: 104 };  // quick-add button on the product image

/* ================= HOOK ================= */
const HK = group(10);
const hkBg = el(HK, '', 'full', 'background:var(--deep)');
const hkL = [el(HK, '<span class="w"><span class="five">5</span></span> <span class="w">things</span>', 'disp', 'color:#fff'),
  el(HK, '<span class="w">that</span> <span class="w">help</span>', 'disp', 'color:#fff'),
  el(HK, '<span class="w"><em>itchy</em></span> <span class="w"><em>skin</em></span>', 'disp', 'color:var(--mint)')];
const hkUnder = el(HK, '<svg width="700" height="50" viewBox="0 0 700 50" preserveAspectRatio="none"><path d="M6 34 C160 14 420 10 694 24" fill="none" stroke="#C25E2E" stroke-width="14" stroke-linecap="round"/></svg>');
const hkSave = el(HK, `<span style="display:inline-block;vertical-align:-12px;margin-right:16px">${BOOKMARK(50)}</span>Save this for later`, 'pill', 'font:700 46px/1 Inter;color:#fff;padding:22px 38px 22px 30px;border:3px solid rgba(159,232,201,.55)');
const hkTiles = ITEMS.map((it, i) => el(HK, `<div style="position:absolute;left:5px;top:22px">${ill(it.ill, 150)}</div>
  <div class="ui" style="position:absolute;left:14px;top:14px;width:46px;height:46px;border-radius:23px;background:var(--deep);color:var(--mint);font:800 27px/46px Inter;text-align:center">${i + 1}</div>`, 'card', 'width:160px;height:236px;border-radius:28px'));
const hkWm = el(HK, '5', 'disp', 'font-size:1150px;line-height:1;color:#123B31;letter-spacing:0');
const hkRing = el(HK, '', '', 'width:176px;height:252px;border-radius:34px;border:5px solid var(--mint);box-sizing:border-box');
function sceneHook(t) {
  if (t > b(S0) + 0.8) return;
  const ex = sp(t - b(S0 - 0.4), 'default');
  put(HK, { x: -1080 * ex, ox: 0, oy: 0 });
  put(hkBg);
  put(hkWm, { x: 1080 - hkWm._w + 60, y: 1240 + rise(t, -0.4, 200, 'heavy') });
  hkL.forEach((l, i) => { put(l, { x: 58, y: hkL._y[i] }); words(l, t, -0.36 + i * 0.07, 0.05, 120, 'heavy'); });
  const ux = 58 + hkL[2]._w * 0, uw = hkL[2]._w;
  hkUnder.querySelector('svg').setAttribute('width', uw);
  put(hkUnder, { x: ux, y: hkL._y[2] + hkL[2]._h - 30, ox: 0 });
  setDraw(hkUnder.querySelector('path'), sp(t - b(2), 'heavy'));
  put(hkSave, { x: 64, y: hkL._y[2] + hkL[2]._h + 50 + rise(t, -0.25, 40), s: pop(t, -0.2, 0.6) * press(t, b(1.5), 0.9), o: op(t, -0.25), ox: 0 });
  const bmk = hkSave.querySelector('.bmk'); const fk = sp(t - b(1.5) - 0.05, 'snappy');
  bmk.setAttribute('fill', fk > 0.5 ? '#9FE8C9' : 'none');
  hkTiles.forEach((c, i) => {
    const t0 = -0.38 + i * b(0.125);
    const sel = i === 0 ? press(t, b(5), 0.9) : 1;
    const wave = 1 + 0.06 * (sp(t - b(3) - i * b(0.125), 'snappy') - sp(t - b(3) - i * b(0.125) - 0.12, 'snappy'));
    put(c, { x: 64 + i * 179 + rise(t, t0, 700, 'default'), y: hkL._tiles, s: sel * wave, r: -8 * (1 - sp(t - t0, 'default')), o: op(t, t0 - 0.05) });
  });
  const rk = sp(t - b(5), 'snappy');
  put(hkRing, { x: 64 - 8, y: hkL._tiles - 8, s: lerp(1.15, 1, rk), o: rk });
}

/* ================= ITEMS ================= */
const IT = ITEMS.map((it, i) => {
  const th = THEMES[it.theme], g = group(20 + i);
  const o = { g, th, it };
  o.bg = el(g, '', 'full', `background:${th.bg}`);
  o.wm = el(g, String(i + 1), 'disp', `font-size:1150px;line-height:1;color:${th.wm};letter-spacing:0`);
  o.s2 = el(g, '', '', `width:${CW}px;height:${CH}px;border-radius:40px;background:${th.s2}`);
  o.s1 = el(g, '', '', `width:${CW}px;height:${CH}px;border-radius:40px;background:${th.s1}`);
  o.badge = el(g, '', 'card', '');
  o.well = el(g, `<div class="ui" style="position:absolute;left:20px;top:20px;padding:11px 18px;border-radius:999px;background:${it.tag === 'BEST SELLER' ? 'var(--mark)' : '#fff'};color:${it.tag === 'BEST SELLER' ? '#fff' : 'var(--deep)'};font:800 28px/1 Inter;letter-spacing:.06em;white-space:nowrap">${it.tag}</div>`, '', `width:380px;height:430px;border-radius:30px;background:${th.well}`);

function groupMove(type, k, entering) {
  // k: 0..1 progress of the transition. Returns transform + clip for the entering or leaving group.
  const a = entering ? 1 - k : -k;
  if (type === 'left') return { x: 1080 * a, y: 0, clip: 'none' };
  if (type === 'up') return { x: 0, y: 1920 * a, clip: 'none' };
  if (type === 'wipe') return entering ? { x: 0, y: 0, clip: `inset(${(1 - k) * 100}% 0 0 0)` } : { x: 0, y: -160 * k, clip: 'none' };
  if (type === 'wipeR') return entering ? { x: 0, y: 0, clip: `inset(0 0 0 ${(1 - k) * 100}%)` } : { x: -180 * k, y: 0, clip: 'none' };
}

/* ---------------- layout from real text widths ---------------- */
function fit(e, maxW, maxS, minS) {
  e.style.fontSize = maxS + 'px'; e.style.display = 'block';
  const w = Math.max(...[...e.querySelectorAll('.ln')].map(l => l.scrollWidth), e.scrollWidth);
  const s = Math.max(minS, Math.min(maxS, Math.floor(maxS * maxW / w)));
  e.style.fontSize = s + 'px'; return s;
}
function measure() {
  for (const e of ALL) e.style.display = 'block';
  // hook title: three lines, same size, as big as the safe area allows
  let hs = 230;
  hkL.forEach(l => { l.style.fontSize = '230px'; hs = Math.min(hs, Math.floor(230 * 872 / l.scrollWidth)); });
  hkL.forEach(l => l.style.fontSize = hs + 'px');
  hkL._y = hkL.map((_, i) => 322 + i * hs * 1.0);
  for (const e of ALL) { e._w = e.offsetWidth; e._h = e.offsetHeight; }
  hkL._tiles = hkL._y[2] + hkL[2]._h + 50 + hkSave._h + 44;
  IT.forEach(o => {
    o.num.style.display = 'block'; o.name._x = Math.max(250, 56 + o.num.offsetWidth + 30);
    fit(o.name, 940 - o.name._x, 150, 100);
    o.name._h = o.name.offsetHeight; o.name._w = o.name.offsetWidth;
    o.name._y = 322 + (300 - o.name._h) / 2;
    // price pill: fixed width at the final price, so it does not jitter while counting
    o.price.innerHTML = '£' + o.it.price.toFixed(2); o.price.style.width = 'auto'; o.price.style.padding = '20px 40px';
    o.price._fw = o.price.offsetWidth; o.price.style.padding = '20px 0';
    o.price._w = o.price._fw; o.price._h = o.price.offsetHeight;
    // chip text: centred vertically at its final size, then typed top-down
    const ct = o.chip.querySelector('.ct'); ct.innerHTML = o.it.chip; const th = ct.offsetHeight;
    ct.style.top = (162 - th) / 2 - 2 + 'px'; o.chip.querySelector('.ckc').style.top = (162 - 64) / 2 + 'px';
    o.num._w = o.num.offsetWidth; o.num._h = o.num.offsetHeight;
  });
  pbT._s = fit(pbT, 872, 140, 100); pbT._l1 = pbT.querySelector('.ln').scrollWidth;
  fit(enT, 872, 200, 120);
  pbPrice.innerHTML = '£48.57'; pbPrice._w = pbPrice.offsetWidth; pbPrice._h = pbPrice.offsetHeight;
  for (const e of [pbSave, pbWas, enBtn, enShip]) { e._w = e.offsetWidth; e._h = e.offsetHeight; }
  for (const e of ALL) e.style.display = 'none';
}

function renderFrame(t) {
  for (const e of ALL) e.style.display = 'none';
  sceneHook(t); for (let i = 0; i < 5; i++) sceneItem(i, t); scenePayoff(t); sceneEnd(t); sceneOverlay(t);
}
window.renderFrame = renderFrame; window.DUR = DUR; window.FPS = FPS; window.BEAT = B;
window.ready = Promise.all([document.fonts.load('560 100px Fraunces'), document.fonts.load('italic 480 100px Fraunces'), document.fonts.load('700 40px Inter'), document.fonts.load('800 40px Inter'), document.fonts.load('600 40px Inter')])
  .then(() => document.fonts.ready).then(() => { measure(); return true; });

if (!new URLSearchParams(location.search).has('render')) {
  const fitStage = () => { const k = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `translate(${(innerWidth - W * k) / 2}px,0) scale(${k})`; };
  addEventListener('resize', fitStage); fitStage();
  window.ready.then(() => { const t0 = performance.now(); const loop = now => { renderFrame(((now - t0) / 1000) % DUR); requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
}
</script>
