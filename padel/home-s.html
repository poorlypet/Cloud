<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PADEL S Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="retail.css">
<style>
:root{}
.wm{position:relative;overflow:hidden}
.wm .mask{position:absolute;inset:0;background:#fff;mix-blend-mode:screen;display:flex;align-items:center;justify-content:center}
.wm .mask span{font-family:var(--mark);color:#000;line-height:1;letter-spacing:-.005em;white-space:nowrap}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hrow h1{font-size:clamp(26px,2.6vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.1;max-width:20ch}
.hrow .b{display:flex;gap:8px;flex-wrap:wrap}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);min-height:min(76vh,740px);border-bottom:1px solid var(--line)}
.hero .t{display:flex;flex-direction:column;justify-content:flex-end;gap:22px;padding:56px var(--g)}
.hero .t h1{font-size:clamp(32px,3.4vw,54px);font-weight:700;letter-spacing:-.025em;line-height:1.05;max-width:13ch}
.hero .t p{color:var(--mute);max-width:40ch}
.hero .m{position:relative;min-height:380px}
@media(max-width:1100px){.hero{grid-template-columns:1fr}.hero .m{order:-1;min-height:62vw}.hero .t{padding-block:32px}}
@media(max-width:1100px){.hrow .b{width:100%}}
</style></head>
<body>
<header class="hdr" data-hdr></header>
<section class="hero"><div class="t"><h1>Rackets for every level of player.</h1><p>Shop padel and pickleball from over 40 brands, with the level and shape listed on every racket.</p><div class="b"><a class="btn" href="#">Shop padel rackets</a><a class="btn ol" href="#">Shop pickleball</a></div></div><div class="m"><video class="vid" autoplay muted loop playsinline poster="media/court.jpg" src="media/court.mp4"></video></div></section>
<div data-m="trust"></div>
<div data-m="collections" data-title="Shop by collection"></div>
<div data-m="products" data-tabs="new,beginner,advanced" data-n="4" data-cls="t0"></div>
<div data-m="journal" data-cls="t0"></div>
<div data-m="reviews"></div>
<div data-m="nl"></div>
<div data-m="ftr"></div>
<script src="retail.js"></script>

</body></html>
