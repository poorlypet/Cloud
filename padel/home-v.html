<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Raqello V Two sports</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="retail.css">
<style>
:root{}
.wm{position:relative;overflow:hidden}
.wm .mask{position:absolute;inset:0;background:#fff;mix-blend-mode:screen;display:flex;align-items:center;justify-content:center}
.wm .mask span{font-family:var(--mark);color:#000;line-height:1;letter-spacing:-.005em;white-space:nowrap}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hrow h1{font-size:clamp(26px,2.6vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.1;max-width:20ch}
.hrow .b{display:flex;gap:8px;flex-wrap:wrap}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px var(--g) 0;max-width:var(--max);margin:0 auto}
.hero a{display:flex;flex-direction:column;gap:14px}
.hero .ph{aspect-ratio:4/5;max-height:76vh;width:100%}
.hero .cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero h2{font-size:clamp(24px,2.2vw,34px);font-weight:700;letter-spacing:-.02em}
.hero a:hover h2{text-decoration:underline}
@media(max-width:1100px){.hero{grid-template-columns:1fr}.hero .ph{aspect-ratio:1}}
@media(max-width:1100px){.hrow .b{width:100%}}
</style></head>
<body>
<header class="hdr" data-hdr></header>
<section class="hero"><a href="#"><div class="ph"><span class="note">Photo: padel player at the glass, outdoor court, natural light</span></div><div class="cap"><h2>Padel</h2><span class="ul">Shop 214 rackets</span></div></a>
<a href="#"><div class="ph"><span class="note">Photo: pickleball player mid volley, indoor hall</span></div><div class="cap"><h2>Pickleball</h2><span class="ul">Shop 64 paddles</span></div></a></section><div style="height:40px"></div>
<div data-m="trust"></div>
<div data-m="logos"></div>
<div data-m="products" data-title="New in" data-f="new" data-n="8" data-cls="t0"></div>
<div data-m="acc" data-cls="t0"></div>
<div data-m="reviews"></div>
<div data-m="nl"></div>
<div data-m="ftr"></div>
<script src="retail.js"></script>

</body></html>
