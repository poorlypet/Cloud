<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PADEL U Mono video</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="retail.css">
<style>
:root{}
.wm{position:relative;overflow:hidden}
.wm .mask{position:absolute;inset:0;background:#fff;mix-blend-mode:screen;display:flex;align-items:center;justify-content:center}
.wm .mask span{font-family:var(--mark);color:#000;line-height:1;letter-spacing:-.005em;white-space:nowrap}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hrow h1{font-size:clamp(26px,2.6vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.1;max-width:20ch}
.hrow .b{display:flex;gap:8px;flex-wrap:wrap}
.hero{position:relative;height:min(74vh,720px);min-height:460px;background:#000;color:#fff}
.hero video{filter:grayscale(1) brightness(.68)}
.hero .wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:20px;padding-block:44px}
.hero h1{font-size:clamp(28px,3vw,46px);font-weight:700;letter-spacing:-.02em;line-height:1.08;max-width:16ch}
.hero .btn{background:#fff;color:#000;border-color:#fff}.hero .btn:hover{background:transparent;color:#fff}
.hero .btn.ol{background:transparent;color:#fff}.hero .btn.ol:hover{background:#fff;color:#000}
@media(max-width:1100px){.hrow .b{width:100%}}
</style></head>
<body>
<header class="hdr" data-hdr></header>
<section class="hero"><video class="vid" autoplay muted loop playsinline poster="media/rally.jpg" src="media/rally.mp4"></video><div class="wrap"><h1>Padel and pickleball, from the brands players trust.</h1><div class="b"><a class="btn" href="#">Shop padel rackets</a><a class="btn ol" href="#">Shop pickleball</a></div></div></section>
<div data-m="trust"></div>
<div data-m="cats" data-title="Shop by category"></div>
<div data-m="rotw" data-cls="grey" data-i="8"></div>
<div data-m="products" data-title="Pickleball" data-f="pickle"></div>
<div data-m="reviews"></div>
<div data-m="nl"></div>
<div data-m="ftr"></div>
<script src="retail.js"></script>

</body></html>
