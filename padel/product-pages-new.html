<title>Raqello Product Pages</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap">
<style>
/* Layout: a switcher bar, then one full storefront product page at a time, mobile first, two columns from 900px. Single light look on purpose: product photos are shot on pure white. */
:root{
  --paper:#FFFFFF; --ink:#0B0B0B; --mute:#6B6B6B; --line:#E7E7E7; --fog:#F5F5F4;
  --accent:#FF4F00; --on-accent:#FFFFFF; --klarna:#FFB3C7; --good:#1F8A4C;
  --display:'Anton','Arial Narrow',Impact,sans-serif;
  --head:'Inter Tight','Helvetica Neue',Arial,sans-serif;
  --body:'Archivo',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}

/* switcher */
.sw{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);color:#fff;display:flex;gap:8px;align-items:center;padding-block:10px;overflow-x:auto}
.sw b{font:600 12px var(--head);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;margin-right:6px}
.sw button{background:transparent;border:1px solid #444;border-radius:99px;padding:6px 14px;font:600 13px var(--head);white-space:nowrap;color:#fff}
.sw button[aria-pressed=true]{background:#fff;color:var(--ink);border-color:#fff}
.note{font:500 12px var(--head);color:var(--mute);padding-block:10px;border-bottom:1px solid var(--line)}

/* shop chrome */
.hdr{display:flex;align-items:center;justify-content:space-between;padding-block:14px;border-bottom:1px solid var(--line)}
.logo{font:24px/1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.ico{display:flex;gap:16px;font:600 13px var(--head)}
.crumb{font:500 12px var(--head);color:var(--mute);padding-block:10px}
.crumb a{color:inherit;text-decoration:none}

/* shared atoms */
.vendor{font:600 12px var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.title{font-family:var(--display);font-weight:400;font-size:clamp(30px,7vw,46px);line-height:.95;text-transform:uppercase;letter-spacing:.005em;margin:6px 0 0;text-wrap:balance}
.price{font:700 24px var(--head);font-variant-numeric:tabular-nums}
.vat{font:500 12px var(--head);color:var(--mute)}
.klarna{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.kl{display:inline-flex;align-items:center;background:var(--klarna);color:#0B0B0B;border-radius:6px;padding:3px 7px;font:800 13px/1 Arial,Helvetica,sans-serif;letter-spacing:-.02em;flex:none}
.stock{display:flex;align-items:center;gap:6px;font:600 13px var(--head);color:var(--good)}
.stock::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.atc{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;border:0;border-radius:4px;background:var(--ink);color:#fff;font:700 15px var(--head);letter-spacing:.04em;text-transform:uppercase}
.atc.or{background:var(--accent);color:var(--on-accent)}
.trust{display:grid;gap:10px;font:500 13px var(--head)}
.trust div{display:flex;gap:10px;align-items:flex-start}
.trust svg{flex:none;width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:99px;padding:6px 12px;font:600 12px var(--head)}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:118px 1fr 24px;align-items:center;gap:10px;font:600 13px var(--head)}
.bar i{display:block;height:6px;background:var(--fog);border-radius:3px;position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--v);background:var(--ink);border-radius:3px}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
.specs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.specs div{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:2px}
.specs dt{font:600 11px var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.specs dd{margin:0;font:600 15px var(--head)}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px 0;font:700 15px var(--head);cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:400 22px var(--head)}
details[open] summary::after{content:"\2212"}
details .in{padding-bottom:16px;color:#2a2a2a}
details .in p{margin:0 0 10px;max-width:62ch}
.feat{display:grid;gap:4px}
.feat b{font:700 15px var(--head)}
.feat span{color:#3a3a3a;font-size:14px}
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.sbar .p{font:700 17px var(--head);line-height:1.1;font-variant-numeric:tabular-nums}
.sbar .p small{display:block;font:500 11px var(--head);color:var(--mute)}
.sbar .atc{height:48px;flex:1}
.d{display:none}
.d.on{display:block}
.pb{padding-bottom:90px}
img{display:block;max-width:100%}
.ph{background:var(--paper)}
.ph img{width:100%;height:100%;object-fit:contain}

/* ===== A: Swipe ===== */
.A .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.A .gal::-webkit-scrollbar{display:none}
.A .gal .ph{flex:0 0 100%;aspect-ratio:1;scroll-snap-align:center}
.A .dots{display:flex;justify-content:center;gap:6px;padding:8px 0}
.A .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.A .dots i.on{background:var(--ink);width:18px;border-radius:3px}
.A .info{display:grid;gap:16px;padding-block:8px 24px}
.A .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
@media(min-width:900px){
  .A .wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:48px;max-width:1280px;margin:0 auto}
  .A .gal{display:grid;grid-template-columns:1fr 1fr;gap:4px;overflow:visible}
  .A .gal .ph{aspect-ratio:1}
  .A .gal .ph:first-child{grid-column:span 2}
  .A .dots{display:none}
  .A .info{position:sticky;top:70px;align-self:start;padding-top:24px}
}

/* ===== B: Spec board ===== */
.B .hero{display:grid;gap:4px}
.B .main{aspect-ratio:1}
.B .thumbs{display:flex;gap:6px;overflow-x:auto;padding-block:6px;scrollbar-width:none}
.B .thumbs button{flex:0 0 64px;height:64px;border:1px solid var(--line);border-radius:4px;padding:2px;background:var(--paper)}
.B .thumbs button[aria-current=true]{border-color:var(--ink)}
.B .thumbs img{width:100%;height:100%;object-fit:contain}
.B .tiles{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ink);border-radius:6px;overflow:hidden}
.B .tiles div{padding:10px 8px;border-right:1px solid var(--ink);display:grid;gap:2px;text-align:center}
.B .tiles div:last-child{border-right:0}
.B .tiles span{font:600 10px var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.B .tiles b{font:18px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.B .info{display:grid;gap:18px;padding-block:16px 28px}
.B .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-block:8px 32px}
.B .fcard{display:grid;gap:8px}
.B .fcard .ph{aspect-ratio:1;overflow:hidden;border-radius:4px}
.B .fcard .ph img{object-fit:cover}
.B h2{font:26px/1 var(--display);text-transform:uppercase;margin:24px 0 12px}
@media(min-width:900px){
  .B .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;max-width:1280px;margin:0 auto}
  .B .fgrid{grid-template-columns:repeat(4,1fr)}
  .B .info{position:sticky;top:70px;align-self:start}
  .B .low{max-width:1280px;margin:0 auto}
}

/* ===== C: Story ===== */
.C .top{display:grid;gap:16px}
.C .main{aspect-ratio:4/5}
.C .info{display:grid;gap:16px;padding-block:4px 28px}
.C .story{display:grid;gap:40px;padding-block:24px 48px;border-top:1px solid var(--line)}
.C .st{display:grid;gap:14px}
.C .st .ph{aspect-ratio:1;overflow:hidden}
.C .st .ph img{object-fit:cover}
.C .st h3{font:28px/1 var(--display);text-transform:uppercase;margin:0}
.C .st p{margin:0;color:#333;max-width:46ch}
.C .k{font:600 11px var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.C .meter{display:grid;gap:8px}
.C .scale{display:flex;justify-content:space-between;font:600 11px var(--head);color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.C .track{height:10px;background:var(--fog);border-radius:5px;position:relative}
.C .track i{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--accent);transform:translateX(-50%)}
@media(min-width:900px){
  .C .top{grid-template-columns:1.2fr 1fr;gap:48px;max-width:1280px;margin:0 auto}
  .C .info{position:sticky;top:70px;align-self:start;padding-top:24px}
  .C .story{max-width:1080px;margin:0 auto}
  .C .st{grid-template-columns:1fr 1fr;gap:48px;align-items:center}
  .C .st:nth-child(even) .ph{order:2}
}

/* ===== D: Tabs ===== */
.D .gw{display:grid;gap:8px}
.D .main{aspect-ratio:1;position:relative}
.D .badge{position:absolute;top:12px;left:12px;background:var(--ink);color:#fff;font:700 11px var(--head);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:3px}
.D .rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.D .rail button{flex:0 0 72px;height:72px;border:1px solid var(--line);background:var(--paper);padding:2px;border-radius:4px}
.D .rail button[aria-current=true]{border:2px solid var(--ink)}
.D .rail img{width:100%;height:100%;object-fit:contain}
.D .info{display:grid;gap:16px;padding-block:16px 24px}
.D .box{border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:14px}
.D .tabs{display:flex;border-bottom:1px solid var(--line);gap:20px;overflow-x:auto}
.D .tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 0;font:700 14px var(--head);color:var(--mute);white-space:nowrap}
.D .tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
.D .panel{padding-block:18px 40px}
.D .panel p{max-width:62ch;margin:0 0 12px}
.D .panel ul{margin:0;padding-left:18px;display:grid;gap:4px}
@media(min-width:900px){
  .D .wrap{display:grid;grid-template-columns:96px 1fr 1fr;gap:24px;max-width:1280px;margin:0 auto}
  .D .gw{display:contents}
  .D .rail{flex-direction:column;order:-1;overflow:visible}
  .D .rail button{flex:0 0 auto;height:88px;width:88px}
  .D .info{position:sticky;top:70px;align-self:start}
  .D .low{max-width:1280px;margin:0 auto}
}

/* ===== E: Editorial ===== */
.E .band{background:var(--ink);color:#fff;padding-block:22px 18px}
.E .band .vendor{color:#aaa}
.E .band .title{font-size:clamp(40px,11vw,92px)}
.E .band .meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font:600 13px var(--head);color:#ddd}
.E .band .meta b{color:var(--accent)}
.E .gal{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line)}
.E .gal .ph{aspect-ratio:1}
.E .gal .ph:first-child{grid-column:span 2;aspect-ratio:4/3}
.E .gal .ph.c img{object-fit:cover}
.E .info{display:grid;gap:18px;padding-block:20px 32px}
.E .split{display:flex;justify-content:space-between;align-items:center;gap:12px}
.E .lede{font:500 17px/1.45 var(--head);margin:0;max-width:44ch}
.E .num{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.E .num div{display:grid;gap:4px}
.E .num b{font:40px/1 var(--display)}
.E .num span{font:600 11px var(--head);text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
@media(min-width:900px){
  .E .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:48px;max-width:1280px;margin:0 auto}
  .E .info{position:sticky;top:70px;align-self:start}
}
@media(min-width:900px){.sbar{display:none}.pb{padding-bottom:40px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<nav class="sw gut" aria-label="Choose a design"><b>Product page</b>
<button data-d="A" aria-pressed="true">A · Swipe</button>
<button data-d="B" aria-pressed="false">B · Spec board</button>

<button data-d="D" aria-pressed="false">D · Tabs</button>
<button data-d="E" aria-pressed="false">E · Editorial</button>
</nav>

 </div>${sbar}`,

 <section class="band gut"><div class="vendor">${o.vendor} · ${o.season}</div><h1 class="title">${o.title.replace(' Martin Di Nenno', '')}</h1>

const root = document.getElementById('pages');
root.innerHTML = Object.keys(pages).map(k => `<div class="d ${k} pb" id="d${k}">${pages[k]()}</div>`).join('');
function show(k) {
  document.querySelectorAll('.d').forEach(d => d.classList.toggle('on', d.id === 'd' + k));
  document.querySelectorAll('.sw button').forEach(b => b.setAttribute('aria-pressed', b.dataset.d === k));
  document.getElementById('note').textContent = NOTES[k];
  try { localStorage.setItem('pdp', k); } catch (e) {}
}
document.querySelectorAll('.sw button').forEach(b => b.onclick = () => { show(b.dataset.d); window.scrollTo(0, 0); });
let start = 'A'; try { start = localStorage.getItem('pdp') || 'A'; } catch (e) {}
show(pages[start] ? start : 'A');

const gal = document.getElementById('Agal'), dots = [...document.querySelectorAll('#Adots i')];
gal.addEventListener('scroll', () => { const i = Math.round(gal.scrollLeft / gal.clientWidth); dots.forEach((d, j) => d.classList.toggle('on', i === j)); }, { passive: true });
function thumbs(railId, mainId) {
  document.querySelectorAll(`#${railId} button`).forEach(b => b.onclick = () => {
    document.querySelector(`#${mainId} img`).src = I[+b.dataset.i];
    document.querySelectorAll(`#${railId} button`).forEach(x => x.setAttribute('aria-current', x === b));
  });
}
thumbs('Bth', 'Bmain'); thumbs('Drail', 'Dmain');
document.querySelectorAll('#Dtabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#Dtabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  document.querySelectorAll('.D .panel').forEach(p => p.hidden = p.dataset.p !== b.dataset.t);
});
document.querySelectorAll('.atc').forEach(b => b.addEventListener('click', () => { const t = b.textContent; b.textContent = 'Added to bag'; setTimeout(() => b.textContent = t, 1400); }));
</script>
