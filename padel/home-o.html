<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Raqello O Burgundy bento</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,100..900&family=Barlow+Condensed:wght@700;800&family=Big+Shoulders+Display:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shop.css">
<style>
:root{--accent:#7A0F22;--fog:#F3F1F1;--line:#E7E3E3;--dark:#1A0D10;--display:'Barlow Condensed','Arial Narrow',sans-serif;--dw:800;--ds:100%;--dl:0;--dlh:.92;}
.hero{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);grid-template-rows:1fr 1fr;gap:16px;padding:16px var(--g) 0;max-width:calc(var(--max) + 2*var(--g));margin:0 auto;height:min(82vh,800px);min-height:560px}
.hero>a{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:32px;gap:14px}
.hero .big{grid-row:1/3;color:#fff}
.hero .big:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.55),rgba(0,0,0,0) 50%);z-index:1}
.hero>a>*:not(video):not(img){position:relative;z-index:2}
.hero h1{font-size:clamp(44px,5vw,84px)}
.hero h2{font-size:clamp(28px,2.4vw,40px)}
.hero .b1{background:var(--pbg)}
.hero .b1 img{position:absolute;right:6%;top:8%;height:84%;width:auto;transform:rotate(-12deg)}
.hero .b2{background:var(--accent);color:#fff}
@media(max-width:1100px){.hero{grid-template-columns:1fr;grid-template-rows:auto;height:auto}.hero>a{min-height:320px}.hero .big{grid-row:auto;min-height:60vh}}
</style></head>
<body>
<div class="ann" data-ann></div>
<header class="hdr" data-hdr></header>
<section class="hero"><a class="big" href="#"><video class="vid" autoplay muted loop playsinline poster="media/city.jpg" src="media/city.mp4"></video><span class="lbl">City courts</span><h1 class="d">Play anywhere</h1><span class="btn lt">Shop padel</span></a>
<a class="b1" href="#"><img src="media/racket.jpg" alt=""><span class="lbl acc">Beginner</span><h2 class="d">First racket<br>from £40</h2><span class="link">Shop beginner</span></a>
<a class="b2" href="#"><span class="lbl">Now stocking</span><h2 class="d">Pickleball</h2><span class="link">Shop paddles</span></a></section>
<div data-sec="cats" data-cols="6"></div>
<div data-sec="levels" data-dark="2" data-tight="tight"></div>
<div data-sec="products" data-title="Most wanted" data-count="4" data-tight="tight"></div>
<div data-sec="brands" data-tight="tight"></div>
<div data-sec="reviews" data-bg="var(--fog)"></div>
<div data-sec="news"></div>
<div data-sec="ftr"></div>
<script src="shop.js"></script>

</body></html>
