<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Raqello L Court green</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,100..900&family=Barlow+Condensed:wght@700;800&family=Big+Shoulders+Display:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shop.css">
<style>
:root{--accent:#0F6B3E;--fog:#EEF1EE;--line:#E1E5E1;--dark:#0D1F16;--display:'Archivo',Arial,sans-serif;--dw:900;--ds:125%;--dl:-.01em;--dlh:.98;}
.hero{padding:16px var(--g) 0;max-width:calc(var(--max) + 2*var(--g));margin:0 auto}
.hero .ph{min-height:min(74vh,700px);display:flex;align-items:center;justify-content:center;text-align:center;padding:60px 20px}
.hero .ph .note{left:auto;right:16px;text-align:right}
.hero .in{display:flex;flex-direction:column;align-items:center;gap:22px;position:relative}
.hero h1{font-size:clamp(36px,4.6vw,72px)}
.hero p{color:var(--mute);max-width:440px}
.sbar{display:flex;width:min(620px,100%);background:#fff;border:1px solid var(--fg);height:60px;cursor:text}
.sbar span{flex:1;display:flex;align-items:center;padding:0 20px;color:#9A9A9A;text-align:left}
.sbar b{display:flex;align-items:center;padding:0 24px;background:var(--fg);color:var(--bg);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips a{border:1px solid var(--line);background:#fff;height:36px;display:flex;align-items:center;padding:0 14px;font-size:13px}
.chips a:hover{border-color:var(--fg)}
</style></head>
<body>
<div class="ann" data-ann></div>
<header class="hdr" data-hdr></header>
<section class="hero"><div class="ph"><span class="note">Photo: wide shot of outdoor padel court at golden hour, empty, glass walls</span><div class="in"><span class="lbl acc">The padel and pickleball store</span><h1 class="d">Find your next racket</h1><p>Search 40 European brands, or start with your level.</p><button class="sbar" data-open="search"><span>Try “Bullpadel” or “Beginner”</span><b>Search</b></button><div class="chips"><a href="#">Beginner rackets</a><a href="#">Intermediate rackets</a><a href="#">Advanced rackets</a><a href="#">Pickleball paddles</a></div></div></div></section>
<div data-sec="cats" data-cols="3"></div>
<div data-sec="levels" data-dark="2" data-tight="tight"></div>

<div data-sec="news"></div>
