<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PADEL X Products first</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="retail.css">
<style>
:root{}
.wm{position:relative;overflow:hidden}
.wm .mask{position:absolute;inset:0;background:#fff;mix-blend-mode:screen;display:flex;align-items:center;justify-content:center}
.wm .mask span{font-family:var(--mark);color:#000;line-height:1;letter-spacing:-.005em;white-space:nowrap}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hrow h1{font-size:clamp(26px,2.6vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.1;max-width:20ch}
.hrow .b{display:flex;gap:8px;flex-wrap:wrap}
.hero{padding-block:48px 64px}
.hero .top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:32px}
.hero h1{font-size:clamp(34px,4vw,64px);font-weight:700;letter-spacing:-.03em;line-height:1}
.hero .top p{color:var(--mute);margin-top:10px}
@media(max-width:1100px){.hrow .b{width:100%}}
</style></head>
<body>
<header class="hdr" data-hdr></header>
<section class="hero"><div class="wrap"><div class="top"><div><h1>New this week</h1><p>Fresh stock from Bullpadel, Nox, Head and Babolat.</p></div><div class="b" style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="#">Shop all new in</a><a class="btn ol" href="#">Shop pickleball</a></div></div><div class="grid" id="xg"></div></div></section>
<div data-m="trust"></div>
<div data-m="cats" data-title="Shop by category"></div>
<div data-m="spotlight" data-b="Nox" data-cls="t0"></div>
<div data-m="reviews"></div>
<div data-m="nl"></div>
<div data-m="ftr"></div>
<script src="retail.js"></script>
<script>document.addEventListener('DOMContentLoaded',()=>{document.getElementById('xg').innerHTML=PADEL.F.new().slice(0,8).map(PADEL.card).join('')});</script>
</body></html>
