<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Raqello I Navy wordmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,100..900&family=Barlow+Condensed:wght@700;800&family=Big+Shoulders+Display:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shop.css">
<style>
:root{--accent:#FF5A1F;--dark:#0E1A2B;--fog:#F1F3F6;--line:#E2E6EC;--mute:#5E6878;}
.hero{position:relative;padding-block:48px 64px}
.mark{position:relative;height:clamp(110px,30vw,440px);overflow:hidden}
.mark .mask{position:absolute;inset:0;background:#fff;mix-blend-mode:screen;display:flex;align-items:center;justify-content:center}
.mark .mask span{font-family:'Anton',sans-serif;color:#000;font-size:clamp(80px,27vw,420px);line-height:.8;letter-spacing:-.01em}
.hero .row{display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap;margin-top:36px}
.hero h1{font-size:clamp(28px,2.6vw,40px);max-width:22ch}
.hero .row div{display:flex;gap:10px;flex-wrap:wrap}
</style></head>
<body>
<div class="ann" data-ann></div>
<header class="hdr" data-hdr></header>
<section class="hero"><div class="wrap"><div class="mark"><video class="vid" autoplay muted loop playsinline poster="media/rally.jpg" src="media/rally.mp4"></video><div class="mask"><span>Raqello</span></div></div>
<div class="row"><h1 class="d">Europe's best padel brands. Sorted by your level.</h1><div><a class="btn" href="#">Shop rackets</a><a class="btn ghost" href="#">Find my level</a></div></div></div></section>
<div data-sec="usp"></div>
<div data-sec="cats" data-cols="6"></div>
<div data-sec="products" data-title="Just landed" data-count="4" data-tight="tight"></div>
<div data-sec="promo" data-title="Demo it on court" data-text="Borrow up to three rackets for a week. Play your normal sessions, keep the one you love and send the rest back free." data-cta="Book a demo" data-video="court" data-kicker="Try before you buy"></div>
<div data-sec="levels" data-dark="2"></div>
<div data-sec="reviews" data-tight="tight"></div>
<div data-sec="news"></div>
<div data-sec="ftr"></div>
<script src="shop.js"></script>

</body></html>
