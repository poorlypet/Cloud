<link rel="stylesheet" href="shop.css">

.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);min-height:min(82vh,820px)}

.hero .row{display:flex;gap:10px;flex-wrap:wrap}

<div class="ann" data-ann></div>
