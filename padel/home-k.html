<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Raqello K Graphite</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,100..900&family=Barlow+Condensed:wght@700;800&family=Big+Shoulders+Display:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shop.css">
<style>
:root{--bg:#141414;--fg:#F2F2F2;--fog:#1E1E1E;--line:#2D2D2D;--mute:#9A9A9A;--dark:#0A0A0A;color-scheme:dark;}
.btn.lt{background:#F2F2F2}
.rev{background:var(--fog)}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:2px;height:min(82vh,820px);min-height:520px}
.hero a{position:relative;overflow:hidden;color:#fff;display:flex;align-items:flex-end;padding:40px}
.hero a>div{position:relative;display:flex;justify-content:space-between;align-items:flex-end;width:100%;gap:20px;flex-wrap:wrap}
.hero h2{font-size:clamp(40px,4.6vw,76px)}
.hero p{color:#CFCFCF;max-width:300px;margin-top:10px}
.hero .ph .note{top:16px;bottom:auto}
@media(max-width:1100px){.hero{grid-template-columns:1fr;height:auto}.hero a{min-height:60vh;padding:24px}}
</style></head>
<body>
<div class="ann" data-ann></div>
<header class="hdr" data-hdr></header>
<section class="hero"><a href="#"><video class="vid" autoplay muted loop playsinline poster="media/rally.jpg" src="media/rally.mp4"></video><div><div><span class="lbl">320 rackets</span><h2 class="d">Padel</h2><p>Bullpadel, Nox, Head, Babolat and more.</p></div><span class="btn lt">Shop padel</span></div></a>
<a href="#" class="ph dk"><span class="note">Photo: pickleball player, outdoor court, low angle</span><div><div><span class="lbl">64 paddles</span><h2 class="d">Pickleball</h2><p>Joola, Selkirk, Franklin and Head.</p></div><span class="btn lt">Shop pickleball</span></div></a></section>
<div data-sec="cats" data-cols="6"></div>
<div data-sec="products" data-title="New in" data-count="8" data-tight="tight"></div>
<div data-sec="levels" data-tight="tight"></div>
<div data-sec="reviews" data-tight="tight"></div>
<div data-sec="brands" data-tight="tight"></div>
<div data-sec="news"></div>
<div data-sec="ftr"></div>
<script src="shop.js"></script>

</body></html>
