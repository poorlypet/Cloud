<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PADEL P Zoom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="retail.css">
<style>
:root{}
.wm{position:relative;overflow:hidden}
.wm .mask{position:absolute;inset:0;background:#fff;mix-blend-mode:screen;display:flex;align-items:center;justify-content:center}
.wm .mask span{font-family:var(--mark);color:#000;line-height:1;letter-spacing:-.005em;white-space:nowrap}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hrow h1{font-size:clamp(26px,2.6vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.1;max-width:20ch}
.hrow .b{display:flex;gap:8px;flex-wrap:wrap}
.hero{height:230vh;position:relative}
.hero .st{position:sticky;top:64px;height:calc(100vh - 64px);overflow:hidden}
.hero .mask span{font-size:calc((min(100vw,1600px) - 2*var(--g)) / 2.2);transform-origin:46.5% 52%;will-change:transform}
.hero .end{position:absolute;left:0;right:0;bottom:40px;color:#fff;opacity:0;transition:opacity .4s;z-index:2}
.hero .end.on{opacity:1}
.hero .end h1{font-size:clamp(28px,3vw,44px);font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-bottom:20px;max-width:18ch}
.hero .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.5),rgba(0,0,0,0) 50%);opacity:0;transition:opacity .4s}
.hero .shade.on{opacity:1}
@media(max-width:1100px){.hrow .b{width:100%}}
</style></head>
<body>
<header class="hdr" data-hdr></header>
<section class="hero" id="hero"><div class="st wm"><video class="vid" autoplay muted loop playsinline poster="media/rally.jpg" src="media/rally.mp4"></video><div class="mask" id="mk"><span id="w">PADEL</span></div><div class="shade" id="sh"></div>
<div class="end" id="en"><div class="wrap"><h1>Europe's best padel brands, in one store.</h1><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn wh" href="#">Shop padel rackets</a><a class="btn ol" href="#" style="color:#fff">Shop pickleball</a></div></div></div></div></section>
<div data-m="trust"></div>
<div data-m="products" data-tabs="new,best,pickle" data-n="8"></div>
<div data-m="cats" data-cls="t0"></div>
<div data-m="brandcamp" data-cls="t0"></div>
<div data-m="reviews"></div>
<div data-m="nl"></div>
<div data-m="ftr"></div>
<script src="retail.js"></script>
<script>const H=document.getElementById('hero'),W=document.getElementById('w'),MK=document.getElementById('mk');
function t(){const r=H.getBoundingClientRect(),p=Math.min(Math.max(-r.top/(H.offsetHeight-innerHeight),0),1);W.style.transform=`scale(${1+p*p*p*40})`;MK.style.opacity=1-Math.min(Math.max((p-.45)/.25,0),1);const on=p>.7;en.classList.toggle('on',on);sh.classList.toggle('on',on);}
addEventListener('scroll',t,{passive:true});t();</script>
</body></html>
