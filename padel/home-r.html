<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Raqello R Blackout</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="retail.css">
<style>
:root{--accent:#B0141E;}
.wm{position:relative;overflow:hidden}
.wm .mask{position:absolute;inset:0;background:#fff;mix-blend-mode:screen;display:flex;align-items:center;justify-content:center}
.wm .mask span{font-family:var(--mark);color:#000;line-height:1;letter-spacing:-.005em;white-space:nowrap}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hrow h1{font-size:clamp(26px,2.6vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.1;max-width:20ch}
.hrow .b{display:flex;gap:8px;flex-wrap:wrap}
.hero{background:#000;color:#fff;padding-block:28px 52px}
.hero .wm{height:calc(calc((min(100vw,1600px) - 2*var(--g)) / 2.2) * .9)}
.hero .mask{background:#000;mix-blend-mode:multiply}
.hero .mask span{color:#fff;font-size:calc((min(100vw,1600px) - 2*var(--g)) / 2.2)}
.hero .hrow{margin-top:32px}
.hero .btn{background:#fff;color:#000;border-color:#fff}.hero .btn:hover{background:transparent;color:#fff}
.hero .btn.ol{background:transparent;color:#fff;border-color:#fff}.hero .btn.ol:hover{background:#fff;color:#000}
@media(max-width:1100px){.hrow .b{width:100%}}
</style></head>
<body>
<header class="hdr" data-hdr></header>
<section class="hero"><div class="wrap"><div class="wm"><video class="vid" autoplay muted loop playsinline poster="media/rally.jpg" src="media/rally.mp4"></video><div class="mask"><span>Raqello</span></div></div><div class="hrow"><h1>The UK home of European padel.</h1><div class="b"><a class="btn" href="#">Shop padel rackets</a><a class="btn ol" href="#">Shop pickleball</a></div></div></div></section>
<div data-m="trust"></div>
<div data-m="spotlight" data-b="Bullpadel"></div>
<div data-m="products" data-title="New in" data-f="new" data-cls="t0"></div>
<div data-m="soles" data-cls="t0"></div>
<div data-m="reviews"></div>
<div data-m="nl"></div>
<div data-m="ftr"></div>
<script src="retail.js"></script>

</body></html>
