<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Poorly Pet – 18s video ad (Canva import)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;1,9..144,460&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Layout source for the Canva video ad. Type follows poorly-pet.com:
     Fraunces 560 headings with an italic 460 second clause, Inter for small print. */
  body { margin: 0; background: #F5EFE6; }
  .page { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #F5EFE6; }
  h1 {
    position: absolute; left: 70px; top: 220px; width: 940px; margin: 0;
    font-family: 'Fraunces', Georgia, serif; font-weight: 560; font-size: 144px;
    line-height: 1.04; letter-spacing: -0.015em; color: #101B17; text-align: center;
  }
  h1 i { font-style: italic; font-weight: 460; color: #0E3E33; }
  h1.long { font-size: 110px; top: 200px; line-height: 1.06; }
  .logo { position: absolute; left: 240px; top: 830px; width: 600px; height: auto; }
  .small {
    position: absolute; left: 90px; top: 1040px; width: 900px; margin: 0;
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 40px;
    line-height: 1.45; color: #0E3E33; text-align: center;
  }
</style>
</head>
<body>

<section class="page" data-document-role="page" data-label="1 Scratching (0–2.5s)"
  data-speaker-notes="Image to Video (Custom): The golden retriever scratches behind its ear quickly and repeatedly with its back leg, head tilting into the scratch, eyes squinting, fur shaking. Camera stays still. The room stays still.">
  <h1>Scratching<br><i>again?</i></h1>
</section>

<section class="page" data-document-role="page" data-label="2 Anxious (2.5–5s)"
  data-speaker-notes="Image to Video (Custom): The small dog lifts its head a little, ears twitch, it looks at the door, then gives a small anxious sigh and settles. Lamp light glows softly. Very slow camera push-in.">
  <h1>Anxious<br><i>when you’re out?</i></h1>
</section>

<section class="page" data-document-role="page" data-label="3 Slowing down (5–7.5s)"
  data-speaker-notes="Image to Video (Custom): The old chocolate Labrador slowly and stiffly pushes itself up from the bed, while the owner's hand gently supports its chest. Slow, tender movement. Camera stays still.">
  <h1>Slowing<br><i>down?</i></h1>
</section>

<section class="page" data-document-role="page" data-label="4 That breath (7.5–10s)"
  data-speaker-notes="Image to Video (Custom): The dog finishes a big wide yawn right in the owner's face; the owner leans back, laughing and wrinkling their nose. Light-hearted. Camera stays still.">
  <h1>That<br><i>breath…</i></h1>
</section>

<section class="page" data-document-role="page" data-label="5 Recovering (10–12.5s)"
  data-speaker-notes="Image to Video (Custom): The spaniel walks happily forward along the park path with a bouncy step, tongue out, the owner walking alongside holding the harness handle. Slow camera tracking backwards.">
  <h1>Recovering<br><i>from an op?</i></h1>
</section>

<section class="page" data-document-role="page" data-label="6 What helps (12.5–15.5s)"
  data-speaker-notes="Image to Video (Custom): Very slow camera push-in over the flat-lay. The little hearts and paw prints drift gently. Soft light shifts across the linen. Products stay still.">
  <h1 class="long">Whatever they’re going through, <i>we’ve got what helps.</i></h1>
</section>

<section class="page" data-document-role="page" data-label="7 End card (15.5–18s)"
  data-speaker-notes="End card. Static. Fade the logo and line in.">
  <img class="logo" src="https://cdn.shopify.com/s/files/1/1047/4042/1964/files/horizontal-lockup-transparent.png?v=1783282661" alt="Poorly Pet">
  <p class="small">Shop by symptom · Vet-informed<br>Free UK delivery over £39</p>
</section>

</body>
</html>
