<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axel &amp; Hound</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#111;--mute:#6B6B6B;--line:#E6E6E4;--tile:#EAEAEB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--ink:#F2F2F0;--mute:#9A9A97;--line:#2A2A28;--tile:#1C1C1B}}
:root[data-theme="dark"]{--bg:#111;--ink:#F2F2F0;--mute:#9A9A97;--line:#2A2A28;--tile:#1C1C1B}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 Jost,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(40px,7vw,96px) 16px}
h1{font:500 clamp(40px,6vw,72px)/1 "Cormorant Garamond",Georgia,serif}
h1 i{font-style:italic}
.sub{margin-top:14px;color:var(--mute);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:clamp(36px,5vw,64px)}
.c{display:block}
.c .im{display:block;aspect-ratio:1;background:var(--tile);overflow:hidden}
.c .im img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.c:hover .im img{transform:scale(1.03)}
.c .t{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 0 0;border-bottom:1px solid var(--line);padding-bottom:16px}
.c .t b{font:500 26px/1.1 "Cormorant Garamond",Georgia,serif}
.c .t span{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid currentColor}
@media (max-width:760px){.g{grid-template-columns:1fr;gap:28px}}
</style>
</head>
<body>
<main class="wrap">
  <h1>Axel <i>&amp;</i> Hound</h1>
  <p class="sub">Signed off · homepage, collection and product page</p>
  <div class="g">
    <a class="c" href="homepage.html"><span class="im"><img src="../media/dachshund-poster.jpg" alt=""></span><span class="t"><b>Homepage</b><span>Open</span></span></a>
    <a class="c" href="collection.html"><span class="im"><img src="../img/products/raincoat-dublin-olive.jpg" alt=""></span><span class="t"><b>Collection · Coats</b><span>Open</span></span></a>
    <a class="c" href="product.html"><span class="im"><img src="../img/products/puffer-dachshund-plum.jpg" alt=""></span><span class="t"><b>Product · Dachshund Puffer</b><span>Open</span></span></a>
  </div>
</main>
</body>
</html>
