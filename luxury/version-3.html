<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axel &amp; Hound · Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<style>
/* VERSION 3 · GALLERY
   Gloock, a heavy high-contrast serif. Two rows: logo + tools, then the
   categories on a hairline. Mega is image-led: three tall photo tiles.
   Hero uses a true square arrow button and a small oxblood sale square. */
:root{--display:"Gloock",Georgia,serif;--row1:74px;--row2:46px;--hh:120px}
.hdr-bar{height:auto;flex-wrap:wrap;padding:0}
.top{display:flex;align-items:center;width:100%;height:var(--row1);padding:0 var(--gut)}
.logo{font-size:34px;letter-spacing:-.01em}
.logo .amp{font-style:normal}
.tools{gap:22px;font-size:13px}
.tools .help:hover{color:var(--mute)}
.navrow{width:100%;padding:0 var(--gut);border-top:1px solid var(--line)}
.nav{gap:clamp(22px,2.6vw,40px);font-size:13px}
.nl{height:var(--row2)}
.nl::after{bottom:-1px}

.mega::before{display:none}
.mp-in{display:grid;grid-template-columns:240px 1fr;gap:56px;padding:40px var(--gut) 46px}
.mp-title{font:clamp(34px,3vw,46px)/1 var(--display);margin-bottom:22px}
.mp-side li a{display:inline-block;padding:4px 0;font-size:13.5px}
.mp-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mp-fig.tile{position:relative;display:block;color:#fff}
.tile .mp-img{aspect-ratio:1/1.08;max-height:52vh;width:100%}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(14,12,10,.55),rgba(14,12,10,0) 45%);pointer-events:none}
.tile .mp-cap{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;display:flex;flex-direction:column;gap:3px}
.tile .mp-cap b{font:400 26px/1.05 var(--display)}
.tile .mp-cap span{font-size:12px;opacity:.85}

.hero-copy{max-width:600px}
.tag{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;background:var(--sale);color:#fff;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px}
.hero-copy h1{font:400 clamp(44px,5vw,76px)/.98 var(--display);letter-spacing:-.01em}
.hero-row{display:flex;align-items:center;gap:22px;margin-top:22px}
.hero-row p{font-size:13px;line-height:1.55;max-width:300px;opacity:.92}
.sq{display:inline-flex;align-items:center;gap:16px;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.sq i{display:flex;align-items:center;justify-content:center;width:60px;height:60px;background:#fff;color:var(--ink);border:1px solid #fff;transition:background .35s,color .35s}
.sq:hover i{background:transparent;color:#fff}
.sq .arrow{width:18px}
.hero-cta{margin-top:26px}
@media (max-width:1080px){
  :root{--hh:64px}
  .top{height:var(--hh)} .navrow{display:none}
  .logo{font-size:28px}
}
</style>
</head>
<body data-layout="tiles">

<header class="hdr">
  <div class="hdr-bar">
    <div class="top">
      <a class="logo" href="#" aria-label="Axel &amp; Hound, home">Axel <span class="amp">&amp;</span> Hound</a>
      <div class="tools">
        <a class="help" href="#">Help</a>
        <button class="ico hide-m" type="button" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg></button>
        <a class="ico hide-m" href="#" aria-label="Account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.6 4-5.3 7.5-5.3s6.3 1.7 7.5 5.3"/></svg></a>
        <a class="ico" href="#" aria-label="Basket, 0 items"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg></a>
        <button class="ico burger" type="button" data-burger aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16"/></svg></button>
      </div>
    </div>
    <div class="navrow"><ul class="nav" data-nav aria-label="Shop"></ul></div>
  </div>
</header>

<main>
  <section class="hero" aria-label="The Winter Sale">
    <video autoplay muted loop playsinline preload="auto" poster="media/dachshund-poster.jpg">
      <source media="(max-width: 700px)" src="media/dachshund-mobile.mp4" type="video/mp4">
      <source src="media/dachshund-1080.mp4" type="video/mp4">
    </video>
    <div class="hero-shade"></div>
    <div class="hero-copy">
      <span class="tag">Sale</span>
      <h1>The Winter Sale</h1>
      <div class="hero-row">
        <p>Up to 30% off selected beds, coats and throws. Until 5 January.</p>
      </div>
      <div class="hero-cta">
        <a class="sq" href="#"><i><svg class="arrow" viewBox="0 0 16 10"><path d="M0 5h15M11 1l4 4-4 4"/></svg></i>Shop the sale</a>
      </div>
    </div>
    <button class="pause" type="button" data-pause aria-label="Pause video">
      <svg class="i-pause" viewBox="0 0 10 10"><rect x="1" width="2.6" height="10"/><rect x="6.4" width="2.6" height="10"/></svg>
      <svg class="i-play" viewBox="0 0 10 10"><path d="M1.5 0l8 5-8 5z"/></svg>
    </button>
  </section>
</main>

<script src="js/menu.js"></script>
</body>
</html>
