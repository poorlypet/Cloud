<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axel &amp; Hound · Heritage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Albert+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/r2.css">
<style>
/* D · HERITAGE. White header with Sale in the menu. Libre Caslon Text 700 display, Albert Sans body. Mega: two link columns and three product cards with prices. */
:root{--display:"Libre Caslon Text",Georgia,serif;--sans:"Albert Sans",system-ui,sans-serif;--hh:80px}
.logo{font-size:25px;font-weight:700;letter-spacing:-.01em}
.nav{margin-left:clamp(36px,4vw,64px);gap:clamp(20px,2.2vw,32px);font-size:14px}
.help{font-size:14px;margin-right:4px}
.mp-in{grid-template-columns:minmax(150px,1fr) minmax(150px,1fr) minmax(0,3.6fr)}
.mp-prods-h{display:flex;justify-content:space-between;align-items:baseline}
.mp-prods-h a{font-size:12.5px;border-bottom:1px solid currentColor}
.mp-prow{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.mp-prod .mp-img{background:var(--stone)}
.mp-prod .mp-t{font-weight:400}
.mp-prod .mp-s{color:var(--ink2)}
.hero-copy h1{font:700 clamp(30px,2.9vw,46px)/1.05 var(--display);letter-spacing:-.015em;margin:0 0 12px}
.hero-copy .sub{font-size:14px;margin-bottom:24px;opacity:.92}
.hero-copy .sub b{font-weight:600}
.ctas{display:flex;align-items:center;gap:26px}
.tl{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.6);padding-bottom:3px}
.tl:hover{border-color:#fff}
</style>
</head>
<body data-layout="colsproducts">

<header class="hdr">
  <div class="hdr-bar">
    <a class="logo" href="#" aria-label="Axel &amp; Hound, home">Axel <span class="amp">&amp;</span> Hound</a>
    <ul class="nav" data-nav data-sale aria-label="Shop"></ul>
    <div class="tools">
      <a class="help" href="#">Help</a>
      <button class="ico hide-m" type="button" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg></button>
      <a class="ico hide-m" href="#" aria-label="Account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.6 4-5.3 7.5-5.3s6.3 1.7 7.5 5.3"/></svg></a>
      <a class="ico hide-m" href="#" aria-label="Wishlist"><svg viewBox="0 0 24 24"><path d="M12 19.5s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 7a4.2 4.2 0 0 1 7.5 2.5c0 5.4-7.5 10-7.5 10z"/></svg></a>
      <a class="ico" href="#" aria-label="Basket, 0 items"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg></a>
      <button class="ico burger" type="button" data-burger aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16"/></svg></button>
    </div>
  </div>
</header>

<main>
  <section class="hero" aria-label="The Winter Sale">
    <video autoplay muted loop playsinline preload="auto" poster="../media/dachshund-poster.jpg">
      <source media="(max-width: 700px)" src="../media/dachshund-mobile.mp4" type="video/mp4">
      <source src="../media/dachshund-1080.mp4" type="video/mp4">
    </video>
    <div class="hero-shade"></div>
    <div class="hero-copy">
      <h1>Made to be lived with.</h1>
      <p class="sub"><b>The Winter Sale</b> · up to 30% off, until 5 January</p>
      <div class="ctas"><a class="btn dark" href="#">Shop the sale</a><a class="tl" href="#">New in</a></div>
    </div>
    <button class="pause" type="button" data-pause aria-label="Pause video">
      <svg class="i-pause" viewBox="0 0 10 10"><rect x="1" width="2.6" height="10"/><rect x="6.4" width="2.6" height="10"/></svg>
      <svg class="i-play" viewBox="0 0 10 10"><path d="M1.5 0l8 5-8 5z"/></svg>
    </button>
  </section>
  <section class="next"><h2>New in for winter</h2><p>Next section placeholder · scroll to see the header change</p></section>
  <div class="next-grid"><span></span><span></span><span></span><span></span></div>
</main>

<script src="../js/r2.js"></script>
</body>
</html>
