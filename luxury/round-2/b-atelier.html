<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axel &amp; Hound · Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/r2.css">
<style>
/* B · ATELIER. White header, categories centred. Bodoni Moda 600 display, Hanken Grotesk body. Mega: three link columns and one wide feature image. Hero sits in a white frame. */
:root{--display:"Bodoni Moda",Didot,Georgia,serif;--sans:"Hanken Grotesk",system-ui,sans-serif;--hh:80px}
.logo{font-size:20px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.nav{position:absolute;left:50%;top:0;transform:translateX(-50%);gap:clamp(18px,2vw,30px);font-size:11.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.tools{gap:24px;font-size:11.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.tools a:hover{opacity:.6}
.bag-i{display:none}
.mp-in{grid-template-columns:repeat(3,minmax(140px,1fr)) minmax(380px,2.5fr)}
.mp-in .mp-card .mp-t{font:italic 500 20px/1.2 var(--display);margin-top:16px}
.frame{padding:0 var(--gut)}
.hero-copy h1{font:600 clamp(32px,3.2vw,50px)/1.02 var(--display);margin:12px 0 12px}
.hero-copy h1 i{font-weight:500}
.hero-copy .sub{font-size:14px;opacity:.92;margin-bottom:24px;max-width:340px}
@media (max-width:1080px){.bag-i{display:inline-flex}.logo{font-size:16px;letter-spacing:.16em}.frame{padding:0}}
</style>
</head>
<body data-layout="colsfeature">

<header class="hdr">
  <div class="hdr-bar">
    <a class="logo" href="#" aria-label="Axel &amp; Hound, home">Axel <span class="amp">&amp;</span> Hound</a>
    <ul class="nav" data-nav aria-label="Shop"></ul>
    <div class="tools">
      <a class="help" href="#">Help</a>
      <a class="hide-m" href="#">Search</a>
      <a class="hide-m" href="#">Account</a>
      <a class="hide-m" href="#">Basket (0)</a>
      <a class="ico bag-i" href="#" aria-label="Basket, 0 items"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg></a>
      <button class="ico burger" type="button" data-burger aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16"/></svg></button>
    </div>
  </div>
</header>

<main class="frame">
  <section class="hero" aria-label="The Winter Sale">
    <video autoplay muted loop playsinline preload="auto" poster="../media/dachshund-poster.jpg">
      <source media="(max-width: 700px)" src="../media/dachshund-mobile.mp4" type="video/mp4">
      <source src="../media/dachshund-1080.mp4" type="video/mp4">
    </video>
    <div class="hero-shade"></div>
    <div class="hero-copy">
      <p class="eyebrow">Sale now on</p>
      <h1>Winter, <i>made softer.</i></h1>
      <p class="sub">Up to 30% off beds, coats and wool throws, until 5 January.</p>
      <a class="btn" href="#">Shop the sale</a>
    </div>
    <button class="pause" type="button" data-pause aria-label="Pause video">
      <svg class="i-pause" viewBox="0 0 10 10"><rect x="1" width="2.6" height="10"/><rect x="6.4" width="2.6" height="10"/></svg>
      <svg class="i-play" viewBox="0 0 10 10"><path d="M1.5 0l8 5-8 5z"/></svg>
    </button>
  </section>
  <section class="next"><h2>New in for winter</h2><p>Next section placeholder · scroll to see the header change</p></section>
  <div class="next-grid"><span></span><span></span><span></span><span></span></div>
</main>

<script src="../js/r2.js"></script>
</body>
</html>
