<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axel &amp; Hound · Sand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/r3.css">
<style>
/* I · SAND. Layout C on a warm sand ground. Gloock with Instrument Sans. Mega: each link carries a small photograph, with one product to the right. */
:root{--display:"Gloock",Georgia,serif;--sans:"Instrument Sans",system-ui,sans-serif;--hh:124px;
  --solid-bg:#F2ECE2;--solid-ink:#2B231B;--solid-line:#E1D8CA;
  --panel:#F2ECE2;--panel-ink:#2B231B;--panel-ink2:#5A4F43;--panel-mute:#998C7C;--panel-line:#E1D8CA;
  --stone:#E6DDCF;--accent:#2B231B;--accent-ink:#F2ECE2}
.logo{font-size:31px;letter-spacing:-.01em}
.logo .amp{font-style:normal}
.nav{gap:clamp(22px,2.6vw,40px);font-size:14px}
.help{font-size:14px}

.hdr-bar.two{display:block;height:auto;padding:0}
.top{display:flex;align-items:center;height:76px;padding:0 var(--gut)}
.navrow{padding:0 var(--gut);border-top:1px solid var(--solid-line);transition:border-color .5s}
.hdr.clear .navrow{border-color:rgba(255,255,255,.26)}
.nl{height:48px}
.nl::after{bottom:-1px}
.mega{top:100%}
@media (max-width:1080px){.top{height:64px}}

.hero-copy .lbl{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase}
.hero-copy .lbl b{font-weight:500;background:#fff;color:var(--ink);padding:5px 8px}
.hero-copy h1{font:400 clamp(24px,2vw,30px)/1.1 var(--display);margin:14px 0 20px}
</style>
</head>
<body data-layout="thumbs">

<header class="hdr clear">
  <div class="hdr-bar two">
    <div class="top">
      <a class="logo" href="#" aria-label="Axel &amp; Hound, home">Axel <span class="amp">&amp;</span> Hound</a>
      <div class="tools">
      <a class="help" href="#">Help</a>
      <button class="ico" type="button" data-open="search" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg></button>
      <button class="ico hide-m" type="button" data-open="account" aria-label="Account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.6 4-5.3 7.5-5.3s6.3 1.7 7.5 5.3"/></svg></button>
      <button class="ico hide-m" type="button" data-open="saved" aria-label="Saved items"><svg viewBox="0 0 24 24"><path d="M12 19.5s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 7a4.2 4.2 0 0 1 7.5 2.5c0 5.4-7.5 10-7.5 10z"/></svg></button>
      <button class="ico" type="button" data-open="basket" aria-label="Basket"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg><span class="n" data-count></span></button>
      <button class="ico burger" type="button" data-burger aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16"/></svg></button>
      </div>
    </div>
    <div class="navrow"><ul class="nav" data-nav aria-label="Shop"></ul></div>
  </div>
</header>

<main>
  <section class="hero" aria-label="The Winter Sale">
    <video autoplay muted loop playsinline preload="auto" poster="../media/dachshund-poster.jpg">
      <source media="(max-width: 700px)" src="../media/dachshund-mobile.mp4" type="video/mp4">
      <source src="../media/dachshund-1080.mp4" type="video/mp4">
    </video>
    <div class="hero-shade"></div><div class="hero-top"></div>
    <div class="hero-copy">
      <p class="lbl"><b>Sale</b>Up to 30% off</p>
      <h1>Winter beds and throws</h1>
      <a class="sqbtn" href="#">Shop the sale <svg viewBox="0 0 16 10"><path d="M0 5h15M11 1l4 4-4 4"/></svg></a>
    </div>
    <button class="pause" type="button" data-pause aria-label="Pause video">
      <svg class="i-pause" viewBox="0 0 10 10"><rect x="1" width="2.6" height="10"/><rect x="6.4" width="2.6" height="10"/></svg>
      <svg class="i-play" viewBox="0 0 10 10"><path d="M1.5 0l8 5-8 5z"/></svg>
    </button>
  </section>
  <section class="next"><h2>New in for winter</h2><p>Next section placeholder</p></section>
  <div class="next-grid"><span></span><span></span><span></span><span></span></div>
</main>

<script src="../js/r3.js"></script>
</body>
</html>
