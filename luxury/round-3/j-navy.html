<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axel &amp; Hound · Navy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/r3.css">
<style>
/* J · NAVY. Layout A. Header and menus turn ink navy; menus are type only, no photographs. Cormorant Garamond with Instrument Sans, capitals in the menu. */
:root{--display:"Cormorant Garamond",Georgia,serif;--sans:"Instrument Sans",system-ui,sans-serif;
  --solid-bg:#172031;--solid-ink:#ECE7DD;--solid-line:rgba(236,231,221,.14);
  --panel:#172031;--panel-ink:#ECE7DD;--panel-ink2:rgba(236,231,221,.74);--panel-mute:rgba(236,231,221,.48);--panel-line:rgba(236,231,221,.14);
  --accent:#172031;--accent-ink:#ECE7DD}
.logo{font-size:30px;font-weight:600}
.nav{margin-left:clamp(36px,4.4vw,72px);gap:clamp(18px,2.2vw,32px);font-size:11.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.help{font-size:11.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.hero-copy h1{font:italic 500 clamp(28px,2.4vw,36px)/1.05 var(--display)}
.hero-copy p{font-size:13.5px;margin:10px 0 22px;opacity:.9}
.hero-copy p b{font-weight:600}

.mp .ln.is-sale{color:#E7A897}
.mp .ph{background:rgba(255,255,255,.06)}
</style>
</head>
<body data-layout="textonly">

<header class="hdr clear">
  <div class="hdr-bar">
    <a class="logo" href="#" aria-label="Axel &amp; Hound, home">Axel <span class="amp">&amp;</span> Hound</a>
    <ul class="nav" data-nav aria-label="Shop"></ul>
    <div class="tools">
      <a class="help" href="#">Help</a>
      <button class="ico" type="button" data-open="search" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg></button>
      <button class="ico hide-m" type="button" data-open="account" aria-label="Account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.6 4-5.3 7.5-5.3s6.3 1.7 7.5 5.3"/></svg></button>
      <button class="ico hide-m" type="button" data-open="saved" aria-label="Saved items"><svg viewBox="0 0 24 24"><path d="M12 19.5s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 7a4.2 4.2 0 0 1 7.5 2.5c0 5.4-7.5 10-7.5 10z"/></svg></button>
      <button class="ico" type="button" data-open="basket" aria-label="Basket"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg><span class="n" data-count></span></button>
      <button class="ico burger" type="button" data-burger aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16"/></svg></button>
    </div>
  </div>
</header>

<main>
  <section class="hero" aria-label="The Winter Sale">
    <video autoplay muted loop playsinline preload="auto" poster="../media/dachshund-poster.jpg">
      <source media="(max-width: 700px)" src="../media/dachshund-mobile.mp4" type="video/mp4">
      <source src="../media/dachshund-1080.mp4" type="video/mp4">
    </video>
    <div class="hero-shade"></div><div class="hero-top"></div>
    <div class="hero-copy">
      <h1>Winter, at home</h1>
      <p><b>The Sale</b> · up to 30% off selected pieces</p>
      <a class="sqbtn" href="#">Shop the sale <svg viewBox="0 0 16 10"><path d="M0 5h15M11 1l4 4-4 4"/></svg></a>
    </div>
    <button class="pause" type="button" data-pause aria-label="Pause video">
      <svg class="i-pause" viewBox="0 0 10 10"><rect x="1" width="2.6" height="10"/><rect x="6.4" width="2.6" height="10"/></svg>
      <svg class="i-play" viewBox="0 0 10 10"><path d="M1.5 0l8 5-8 5z"/></svg>
    </button>
  </section>
  <section class="next"><h2>New in for winter</h2><p>Next section placeholder</p></section>
  <div class="next-grid"><span></span><span></span><span></span><span></span></div>
</main>

<script src="../js/r3.js"></script>
</body>
</html>
