name = "pp-service-centre"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# the mailbox the portal reads and (from step 4) sends from
[vars]
MAILBOX = "hello@poorly-pet.com"
SHOPIFY_SHOP = "bnq8ig-iq.myshopify.com"

# read new customer emails every 3 minutes
[triggers]
crons = ["*/3 * * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "pp-service-centre"
# Replace with the id printed by: npx wrangler d1 create pp-service-centre
database_id = "00000000-0000-0000-0000-000000000000"

# Secrets (set with: npx wrangler secret put NAME). Never commit them.
#   SETUP_TOKEN   one-off code that lets you create the first owner login
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET   from your Google Cloud OAuth client (step 2)
#   ENCRYPTION_KEY    a long random string (32+ characters) that protects the stored Gmail token
#   ANTHROPIC_API_KEY used to sort emails and write drafts
#   SHOPIFY_CLIENT_ID, SHOPIFY_CLIENT_SECRET   from the Dev Dashboard app (step 3)
